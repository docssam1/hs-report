    <a href="../index.html">← 자료실</a>
    <div><p>G·FIELD MOCK EXAM</p><h1>모의고사 생성기</h1></div>
  </header>
  <p class="pm-intro">지금까지 응시한 모의고사의 검수된 유사문제로 새 시험지를 만듭니다. 응시 시험 전체·틀린 문제·맞은 문제 중 고르고, 10·20·30문항을 선택하세요. 모의고사형 30문항은 2점대 12개, 3점대 10개, 4점대 8개로 구성합니다. 선택한 조건의 문항이 적으면 확보된 문항만 인쇄되며, 진단·채점은 하지 않습니다.</p>
  <section class="pm-controls" aria-label="문항 선택 기준">
    <div class="pm-control-row"><strong>출제 범위</strong><button type="button" data-scope="all">응시 시험 전체</button><button type="button" data-scope="wrong">틀린 문제</button><button type="button" data-scope="correct">맞은 문제</button></div>
    <div class="pm-control-row"><strong>배점대</strong><button type="button" data-band="all">전체</button><button type="button" data-band="2.7">2점대</button><button type="button" data-band="3.4">3점대</button><button type="button" data-band="4.2">4점대</button></div>
    <div class="pm-control-row"><strong>문항 수</strong><button type="button" data-count="10">10문항</button><button type="button" data-count="20">20문항</button><button type="button" data-count="30">모의고사형 · 30문항</button></div>
    <div class="pm-actions"><p id="pmStatus" role="status">응시 기록을 확인하고 있습니다.</p><button id="pmPrint" type="button" disabled>시험지·답안 인쇄 / PDF 저장</button></div>
  </section>
  <div id="pmPages"></div>
