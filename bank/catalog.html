<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>황소 초등 문제은행 | GFIELD</title>
<style>
  :root{
    --bg:#f7f3ea;--paper:#fffefa;--ink:#202938;--muted:#667085;--line:#ded8cb;
    --navy:#17345f;--navy2:#0f2547;--orange:#f97316;--orange-soft:#fff2e6;
    --green:#16794d;--green-soft:#eaf7ef;--amber:#9a6700;--amber-soft:#fff7d6;
    --purple:#6941c6;--purple-soft:#f4f0ff;--blue-soft:#eef5ff;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
  button,input,select{font:inherit}
  a{color:inherit}
  :focus-visible{outline:3px solid #2e90fa;outline-offset:2px}
  .shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:24px 0 70px}
  .topnav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}
  .back{display:inline-flex;align-items:center;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;color:var(--navy);font-size:13px;font-weight:800}
  .topnav .crumb{font-size:12px;color:var(--muted)}
  .hero{position:relative;overflow:hidden;padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;box-shadow:0 16px 42px rgba(15,37,71,.18)}
  .hero:after{content:"";position:absolute;right:-80px;top:-130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,.42),rgba(249,115,22,0) 68%);pointer-events:none}
  .eyebrow{font-size:12px;font-weight:900;letter-spacing:.13em;color:#fdba74}
  h1{position:relative;z-index:1;margin:7px 0 8px;font-size:clamp(26px,4vw,42px);line-height:1.18;letter-spacing:-.045em;word-break:keep-all}
  .hero p{position:relative;z-index:1;max-width:780px;margin:0;color:#d9e4f3;font-size:14px}
  .notice{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:16px 0;padding:15px 17px;border:1px solid #f3d68d;border-radius:15px;background:var(--amber-soft);color:#694900}
  .notice .icon{font-size:20px;line-height:1.4}
  .notice strong{display:block;margin-bottom:2px;font-size:14px}
  .notice p{margin:0;font-size:12.5px}
  .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:16px 0}
  .stat{min-height:116px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 7px 20px rgba(23,52,95,.055)}
  .stat strong{display:block;color:var(--navy);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
  .stat span{display:block;margin-top:8px;font-size:12px;font-weight:900;color:#344054}
  .stat small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.35}
  .stat.practice{border-color:#b7dfc8;background:var(--green-soft)}
  .stat.practice strong{color:var(--green)}
  .filters{position:sticky;top:8px;z-index:10;margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,254,250,.96);box-shadow:0 10px 28px rgba(15,37,71,.1);backdrop-filter:blur(10px)}
  .finder-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .finder-tab{min-height:48px;border:1px solid #b9c6d8;border-radius:12px;background:#fff;color:var(--navy);font-weight:900;cursor:pointer}
  .finder-tab.active{border-color:var(--navy);background:var(--navy);color:#fff}
  .finder-panel[hidden]{display:none}
  .filter-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr)) auto;gap:10px;align-items:end}
  .type-search{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:10px;align-items:end}
  .area-picks{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .area-pick{min-height:36px;padding:7px 11px;border:1px solid #cfc8ba;border-radius:999px;background:#fff;color:#475467;font-size:11px;font-weight:900;cursor:pointer}
  .area-pick.active{border-color:var(--orange);background:var(--orange-soft);color:#a64000}
  .field{display:grid;gap:5px}
  .field label{font-size:11px;font-weight:900;color:#475467}
  .field input,.field select{width:100%;min-height:42px;border:1px solid #cfc8ba;border-radius:10px;background:#fff;padding:9px 11px;color:var(--ink)}
  .reset{min-height:42px;border:1px solid var(--navy);border-radius:10px;padding:9px 13px;background:#fff;color:var(--navy);font-size:12px;font-weight:900;cursor:pointer}
  .filter-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
  #result-status{font-size:12px;font-weight:800;color:var(--navy)}
  .legend{display:flex;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .dot.candidate{background:#e0a400}
  .paper-context{margin:0 0 18px;padding:16px 18px;border:1px solid #cbd8ea;border-radius:18px;background:#f7fbff}
  .paper-context h2{margin:0;color:var(--navy);font-size:16px}
  .paper-context p{margin:4px 0 0;color:var(--muted);font-size:11.5px}
  .paper-metrics,.paper-cuts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .paper-cuts span{padding:5px 8px;border:1px solid #d7e1ef;border-radius:8px;background:#fff;color:#344054;font-size:10.5px;font-weight:800}
  .results{display:grid;gap:18px}
  .area-section{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 9px 28px rgba(23,52,95,.06)}
  .area-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--navy);color:#fff}
  .area-head h2{margin:0;font-size:20px;letter-spacing:-.02em}
  .area-head span{font-size:11px;color:#d8e4f3}
  .subarea{padding:16px 18px;border-top:1px solid var(--line)}
  .subarea:first-of-type{border-top:0}
  .subarea-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .subarea h3{margin:0;color:var(--navy);font-size:16px}
  .subarea-count{font-size:10.5px;color:var(--muted)}
  .sub-review{padding:2px 7px;border-radius:999px;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:900}
  .type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .type-card{min-width:0;padding:14px;border:1px solid #e4dfd5;border-radius:14px;background:#fff}
  .type-card.candidate{border-color:#efd48c;background:#fffdf5}
  .type-card h4{margin:0;font-size:14px;color:#26364e;line-height:1.42;word-break:keep-all}
  .badges,.sources,.development{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
  .badge{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900;line-height:1.25}
  .badge.confirmed{background:var(--green-soft);color:var(--green)}
  .badge.candidate{background:var(--amber-soft);color:var(--amber)}
  .badge.source{background:var(--blue-soft);color:#28558a}
  .badge.practice{background:var(--green-soft);color:var(--green);text-decoration:none}
  .badge.planned{background:#f2f4f7;color:#667085}
  .badge.pending{background:var(--purple-soft);color:var(--purple)}
  .badge.na{background:#f4f4f2;color:#77746c}
  .type-id{margin-top:8px;color:#98a2b3;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
  .raw-types{margin-top:10px;border-top:1px dashed #ddd5c7;padding-top:8px}
  .raw-types summary{cursor:pointer;color:#475467;font-size:11px;font-weight:800}
  .raw-types ul{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0;padding:0;list-style:none}
  .raw-types li,.raw-single{display:inline-flex;margin:0;padding:3px 7px;border:1px solid #e2ddd2;border-radius:7px;background:#faf9f6;color:#4f5968;font-size:10.5px;word-break:keep-all}
  .raw-single{margin-top:9px}
  .empty{padding:34px;border:1px dashed #cfc8ba;border-radius:16px;background:#fff;text-align:center;color:var(--muted)}
  .error{padding:22px;border:1px solid #f3b4ad;border-radius:16px;background:#fff1f0;color:#912018}
  @media(max-width:1040px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:720px){
    .shell{width:min(100% - 20px,1180px);padding-top:12px}.hero{padding:22px 18px;border-radius:18px}.hero p{font-size:12.5px}
    .stats{grid-template-columns:repeat(2,1fr)}.stat{min-height:104px}.stat strong{font-size:24px}
    .filters{position:static;padding:13px}.filter-grid,.type-search{grid-template-columns:1fr 1fr}.reset{width:100%}
    .type-grid{grid-template-columns:1fr}.area-head,.subarea{padding-left:13px;padding-right:13px}.paper-context{padding:13px}
  }
  @media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.filter-grid,.type-search{grid-template-columns:1fr}.finder-tabs{grid-template-columns:1fr 1fr}.notice{grid-template-columns:1fr}.notice .icon{display:none}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  @media print{.screen-only{display:none!important}.shell{width:100%;padding:0}.area-section{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<main class="shell">
  <nav class="topnav screen-only" aria-label="문제은행 이동">
    <a class="back" href="index.html">← 문제은행 연습지</a>
    <a class="back" href="../index.html">자료실</a>
    <span class="crumb">문제은행 유형 선택</span>
  </nav>

  <header class="hero">
    <div class="eyebrow">GFIELD BULL BANK</div>
    <h1>황소 초등 문제은행</h1>
    <p>시험지로 찾거나, 지문·유형·영역으로 바로 찾습니다.</p>
  </header>

  <section class="filters screen-only" aria-label="문제은행 찾기">
    <div class="finder-tabs" role="tablist" aria-label="문제 찾는 방법">
      <button class="finder-tab active" id="paper-tab" type="button" role="tab" aria-selected="true" aria-controls="paper-panel">시험지로 찾기</button>
      <button class="finder-tab" id="type-tab" type="button" role="tab" aria-selected="false" aria-controls="type-panel">유형으로 찾기</button>
    </div>
    <form id="filter-form">
      <div class="finder-panel" id="paper-panel" role="tabpanel" aria-labelledby="paper-tab">
        <div class="filter-grid">
          <div class="field"><label for="source-filter">시험지</label><select id="source-filter"><option value="applied">활용 모의고사</option><option value="final">파이널 모의고사</option><option value="last">최종 모의고사</option><option value="original">시그니처 실전</option><option value="middle">중급 모의고사</option></select></div>
          <div class="field"><label for="round-filter">회차</label><select id="round-filter"><option value="all">전체 회차</option></select></div>
          <button class="reset" id="reset-paper" type="button">처음으로</button>
        </div>
      </div>
      <div class="finder-panel" id="type-panel" role="tabpanel" aria-labelledby="type-tab" hidden>
        <div class="type-search">
          <div class="field search"><label for="search">지문 또는 유형</label><input id="search" type="search" placeholder="예: 숫자 3이 적힌 쪽, 쌓기나무, 최단거리" autocomplete="off"></div>
          <button class="reset" id="reset-type" type="button">검색 지우기</button>
        </div>
        <div class="area-picks" role="group" aria-label="영역별 전체 유형">
          <button class="area-pick active" type="button" data-area="all">전체 유형</button>
          <button class="area-pick" type="button" data-area="수·규칙찾기">수·규칙찾기</button>
          <button class="area-pick" type="button" data-area="식의 계산">식의 계산</button>
          <button class="area-pick" type="button" data-area="도형">도형</button>
          <button class="area-pick" type="button" data-area="경우의 수">경우의 수</button>
        </div>
      </div>
    </form>
    <div class="filter-foot">
      <div id="result-status" role="status" aria-live="polite">분류 데이터를 불러오는 중입니다.</div>
    </div>
  </section>

  <section id="paper-context" class="paper-context screen-only" aria-live="polite">
    <h2>시험지 난이도 기준</h2>
    <p>회차를 선택하면 해당 시험의 평균과 점수 구간을 먼저 확인할 수 있습니다.</p>
  </section>

  <section id="results" class="results" aria-label="대영역과 소영역별 유형 목록" aria-busy="true"></section>
</main>

<script src="../mock-data.js"></script>
<script src="../mock-data-hw.js"></script>
<script src="../mock-data-final.js"></script>
<script src="../mock-data-last.js"></script>
<script src="../mock-data-last3.js"></script>
<script src="../mock-data-last4.js"></script>
<script src="../last-score-data.js"></script>
<script src="../mock-data-original.js"></script>
<script src="bank-registry.js"></script>
<script type="text/plain" id="legacy-catalog-script">
(function(){
  'use strict';
  var R=window.BANK_TYPE_REGISTRY;
  var SOURCE_LABELS={mid:'중급',hw:'활용',final:'파이널',last:'최종',original:'시그니처 실전'};
  var AREA_ORDER=['수·규칙찾기','식의 계산','도형','경우의 수'];
  var $=function(id){return document.getElementById(id)};

  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
  function unique(values){var seen={};return values.filter(function(value){var key=String(value);if(seen[key])return false;seen[key]=true;return true})}
  function setText(id,value){$(id).textContent=String(value)}
  function questionCount(group,source){return source==='all'?group.itemCount:Number(group.sourceCounts[source]||0)}

  function buildLastCatalogModel(){
    var paper=window.GFIELD_MOCK_LAST||{},scores=window.GFIELD_LAST_SCORE_DATA||{};
    var rounds={};
    Object.keys(scores.rounds||{}).forEach(function(roundKey){
      var scoreRound=scores.rounds[roundKey]||{};
      var paperRound=paper.rounds&&paper.rounds[roundKey];
      var paperQuestions=paperRound&&paperRound.paper&&paperRound.paper.questions;
      if(!Array.isArray(scoreRound.items)||scoreRound.items.length!==30||!Array.isArray(paperQuestions)||paperQuestions.length!==30){
        throw new Error('최종 '+roundKey+'회 30문항 분류·시험지 연결을 확인할 수 없습니다.');
      }
      rounds[roundKey]={items:scoreRound.items};
    });
    if(Object.keys(rounds).length!==4)throw new Error('최종 모의고사 1~4회 분류 데이터가 모두 필요합니다.');
    return {title:paper.title||'최종 모의고사',questions:30,rounds:rounds};
  }

  function aggregate(unified,originalCatalog){
    var originalById={};
    originalCatalog.forEach(function(entry){originalById[entry.id]=entry});
    var map={};
    unified.items.forEach(function(item){
      var group=map[item.canonicalTypeId];
      if(!group){
        group=map[item.canonicalTypeId]={
          id:item.canonicalTypeId,area:item.area,subarea:item.subarea,familyLabel:item.typeFamilyLabel,
          displayTypes:[],sourceCounts:{},confirmedCount:0,candidateCount:0,itemCount:0,reviewBases:[]
        };
      }
      if(group.displayTypes.indexOf(item.displayType)<0)group.displayTypes.push(item.displayType);
      group.sourceCounts[item.sourceRef.set]=(group.sourceCounts[item.sourceRef.set]||0)+1;
      group.itemCount++;
      if(item.reviewStatus==='confirmed')group.confirmedCount++;else group.candidateCount++;
      if(group.reviewBases.indexOf(item.reviewBasis)<0)group.reviewBases.push(item.reviewBasis);
    });
    return Object.keys(map).map(function(key){
      var group=map[key],original=originalById[key]||null;
      group.displayTypes.sort(function(a,b){return a.localeCompare(b,'ko')});
      group.original=original;
      group.practiceVerified=!!(original&&original.generator&&original.generator.status==='verified-practice'&&original.generator.practiceReleaseReady===true);
      group.sourcePending=!!(original&&original.sourceFaithfulReleaseReady!==true);
      group.searchText=[group.area,group.subarea,group.familyLabel].concat(group.displayTypes).join(' ').toLocaleLowerCase('ko-KR');
      return group;
    });
  }

  function sourceBadges(group){
    return Object.keys(SOURCE_LABELS).filter(function(key){return group.sourceCounts[key]}).map(function(key){
      return '<span class="badge source">'+esc(SOURCE_LABELS[key])+' '+group.sourceCounts[key]+'문항</span>';
    }).join('');
  }

  function rawTypesHtml(group){
    if(group.displayTypes.length===1)return '<div class="raw-single">원문 유형 · '+esc(group.displayTypes[0])+'</div>';
    return '<details class="raw-types"><summary>원문 유형 '+group.displayTypes.length+'개 보기</summary><ul>'+group.displayTypes.map(function(type){return '<li>'+esc(type)+'</li>'}).join('')+'</ul></details>';
  }

  function typeCardHtml(group){
    var candidate=group.candidateCount>0;
    var title=candidate?(group.familyLabel+' · 검토 후보 묶음'):(group.displayTypes[0]||group.familyLabel);
    var status='';
    if(group.confirmedCount)status+='<span class="badge confirmed">확정 '+group.confirmedCount+'문항</span>';
    if(group.candidateCount)status+='<span class="badge candidate">검토 후보 '+group.candidateCount+'문항</span>';
    var practice=group.practiceVerified
      ?'<a class="badge practice" href="index.html?gen='+encodeURIComponent(group.original.generator.legacyId)+'">연습형 생성기 검증 완료</a>'
      :'<span class="badge planned">연습형 생성기 계획</span>';
    var sourceState=!group.original
      ?'<span class="badge na">원본 복기형 대상 아님</span>'
      :(group.sourcePending?'<span class="badge pending">원본 복기형 대조 대기</span>':'<span class="badge confirmed">원본 복기형 대조 완료</span>');
    return '<article class="type-card '+(candidate?'candidate':'confirmed')+'" data-type-id="'+esc(group.id)+'">'+
      '<h4>'+esc(title)+'</h4><div class="badges">'+status+'</div><div class="sources" aria-label="출처 문항 수">'+sourceBadges(group)+'</div>'+
      '<div class="development">'+practice+sourceState+'</div>'+rawTypesHtml(group)+'<div class="type-id">'+esc(group.id)+'</div></article>';
  }

  function filteredGroups(groups){
    var query=$('search').value.trim().toLocaleLowerCase('ko-KR');
    var area=$('area-filter').value,status=$('status-filter').value,source=$('source-filter').value,dev=$('dev-filter').value;
    return groups.filter(function(group){
      if(query&&group.searchText.indexOf(query)<0)return false;
      if(area!=='all'&&group.area!==area)return false;
      if(status==='confirmed'&&group.candidateCount>0)return false;
      if(status==='candidate'&&group.candidateCount===0)return false;
      if(source!=='all'&&!group.sourceCounts[source])return false;
      if(dev==='verified'&&!group.practiceVerified)return false;
      if(dev==='source-pending'&&!group.sourcePending)return false;
      if(dev==='planned'&&group.practiceVerified)return false;
      return true;
    });
  }

  function renderResults(groups){
    var visible=filteredGroups(groups),source=$('source-filter').value;
    visible.sort(function(a,b){return AREA_ORDER.indexOf(a.area)-AREA_ORDER.indexOf(b.area)||a.subarea.localeCompare(b.subarea,'ko')||a.familyLabel.localeCompare(b.familyLabel,'ko')});
    var areas={};
    visible.forEach(function(group){
      if(!areas[group.area])areas[group.area]={};
      if(!areas[group.area][group.subarea])areas[group.area][group.subarea]=[];
      areas[group.area][group.subarea].push(group);
    });
    var html='';
    AREA_ORDER.concat(Object.keys(areas).filter(function(area){return AREA_ORDER.indexOf(area)<0})).forEach(function(area){
      if(!areas[area])return;
      var subareas=areas[area];
      var areaGroups=Object.keys(subareas).reduce(function(all,key){return all.concat(subareas[key])},[]);
      var areaQuestions=areaGroups.reduce(function(sum,group){return sum+questionCount(group,source)},0);
      html+='<section class="area-section" data-area="'+esc(area)+'"><header class="area-head"><h2>'+esc(area)+'</h2><span>'+areaGroups.length+'유형 · '+areaQuestions+'문항</span></header>';
      Object.keys(subareas).sort(function(a,b){return a.localeCompare(b,'ko')}).forEach(function(subarea){
        var list=subareas[subarea],hasCandidate=list.some(function(group){return group.candidateCount>0});
        var subQuestions=list.reduce(function(sum,group){return sum+questionCount(group,source)},0);
        html+='<section class="subarea"><div class="subarea-head"><h3>'+esc(subarea)+'</h3><span class="subarea-count">'+list.length+'유형 · '+subQuestions+'문항</span>'+(hasCandidate?'<span class="sub-review">후보 포함</span>':'')+'</div><div class="type-grid">'+list.map(typeCardHtml).join('')+'</div></section>';
      });
      html+='</section>';
    });
    if(!html)html='<div class="empty">조건에 맞는 유형이 없습니다. 검색어나 필터를 바꿔 보세요.</div>';
    $('results').innerHTML=html;
    $('results').setAttribute('aria-busy','false');
    var questions=visible.reduce(function(sum,group){return sum+questionCount(group,source)},0);
    $('result-status').textContent='현재 표시: '+visible.length+'유형 · '+questions+'문항';
  }

  function fillAreaFilter(groups){
    var areas=unique(groups.map(function(group){return group.area})).sort(function(a,b){return AREA_ORDER.indexOf(a)-AREA_ORDER.indexOf(b)});
    $('area-filter').innerHTML='<option value="all">전체 대영역</option>'+areas.map(function(area){return '<option value="'+esc(area)+'">'+esc(area)+'</option>'}).join('');
  }

  function fail(error){
    $('results').setAttribute('aria-busy','false');
    $('results').innerHTML='<div class="error"><strong>분류 현황을 불러오지 못했습니다.</strong><br>'+esc(error&&error.message||error)+'</div>';
    $('result-status').textContent='데이터 오류';
  }

  try{
    if(!R)throw new Error('문제은행 분류 레지스트리가 없습니다.');
    var models={
      mid:window.GFIELD_MOCK,hw:window.GFIELD_MOCK_HW,final:window.GFIELD_MOCK_FINAL,
      last:buildLastCatalogModel(),original:window.GFIELD_MOCK_ORIGINAL
    };
    var unified=R.buildUnifiedCatalog(models);
    var originalCatalog=R.buildCatalog(window.GFIELD_MOCK_ORIGINAL);
    var verifiedPractice=originalCatalog.filter(function(type){return !!(type.generator&&type.generator.status==='verified-practice'&&type.generator.practiceReleaseReady===true)}).length;
    setText('stat-questions',unified.summary.sourceQuestions);
    setText('stat-raw-types',unified.summary.rawDisplayTypes);
    setText('stat-canonical-types',unified.summary.canonicalTypes);
    setText('stat-confirmed',unified.summary.confirmedItems);
    setText('stat-candidate',unified.summary.candidateItems);
    setText('stat-verified-practice',verifiedPractice);
    setText('notice-confirmed-count',unified.summary.confirmedItems);
    var groups=aggregate(unified,originalCatalog);
    fillAreaFilter(groups);
    ['search','area-filter','status-filter','source-filter','dev-filter'].forEach(function(id){$(id).addEventListener(id==='search'?'input':'change',function(){renderResults(groups)})});
    $('filter-form').addEventListener('submit',function(event){event.preventDefault();renderResults(groups)});
    $('reset-filter').addEventListener('click',function(){
      $('search').value='';$('area-filter').value='all';$('status-filter').value='all';$('source-filter').value='all';$('dev-filter').value='all';renderResults(groups);$('search').focus();
    });
    renderResults(groups);
    window.__BANK_CATALOG_QA__={summary:unified.summary,verifiedPracticeGenerators:verifiedPractice,groups:groups};
  }catch(error){fail(error)}
})();
</script>
<script src="catalog.js"></script>
</body>
</html>
