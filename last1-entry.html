<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="hs-student-guard.js?v=20261011-email-login-1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최종 모의고사 성적 입력 | 지필드 영재교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#eef1f6;color:#1f2430;line-height:1.55;padding:22px 14px}
.wrap{max-width:720px;margin:0 auto}.card{background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(30,60,114,.11);overflow:hidden}
.hd{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;padding:21px 23px}.hd .tag{font-size:11.5px;opacity:.86;font-weight:700}.hd h1{font-size:21px;margin-top:4px}.hd p{font-size:12px;opacity:.88;margin-top:6px}
.bd{padding:22px}.member{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid #dbe4f0;border-radius:13px;background:#f8fafc;margin-bottom:16px}.member span{font-size:12px;color:#64748b}.member b{font-size:16px;color:#1f3864}
.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a4b14;font-size:12px;line-height:1.7;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.q{min-height:58px;border:1.5px solid #dfe6ef;border-radius:11px;background:#fff;color:#1f3864;font:800 14px inherit;cursor:pointer}.q small{display:block;color:#94a3b8;font-size:9.5px;margin-top:2px}.q.wrong{background:#fee2e2;border-color:#dc2626;color:#b91c1c}.q.wrong small{color:#dc2626}
.summary{display:flex;gap:10px;margin-top:17px}.sum{flex:1;text-align:center;background:#f7f9fc;border:1px solid #e5eaf1;border-radius:12px;padding:11px}.sum span{display:block;font-size:10.5px;color:#8792a2}.sum b{display:block;font-size:20px;color:#1f3864;margin-top:2px}
.save{width:100%;border:0;border-radius:12px;padding:13px 18px;margin-top:14px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font:800 14px inherit;cursor:pointer}.save:disabled{cursor:not-allowed;opacity:.65}
.state{text-align:center;padding:25px 12px;color:#64748b;font-size:13px;line-height:1.8}.state .ico{display:block;font-size:38px;margin-bottom:7px}.state b{color:#1f3864}.link{display:inline-flex;margin-top:13px;padding:10px 16px;border-radius:10px;background:#1f3864;color:#fff;text-decoration:none;font-weight:800}
.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:11px;padding:12px 14px;font-size:12px;margin-top:12px}.hide{display:none}.ft{text-align:center;padding:13px 18px;background:#fafbfd;border-top:1px solid #edf1f5;color:#94a3b8;font-size:10.5px}
@media(max-width:520px){body{padding:12px 9px}.bd{padding:17px 14px}.hd{padding:18px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.q{min-height:55px}.member{align-items:flex-start;flex-direction:column}.summary{gap:7px}.sum{padding:9px 4px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <header class="hd"><div class="tag">최초 응시·연습 재응시</div><h1 id="pageTitle">최종 모의고사 성적 입력</h1><p>90분 시험을 마치고 채점한 뒤, 틀린 문항만 눌러 주세요.</p></header>
  <main class="bd">
    <div id="member" class="member hide"><span>입력 학생</span><b id="studentName"></b></div>
    <div id="loading" class="state"><span class="ico">⏳</span>최초 성적 기록을 확인하고 있어요…</div>
    <div id="blocked" class="state hide"></div>
    <section id="entry" class="hide">
      <div class="notice" id="entryNotice">한 번 저장된 <b>최초 성적은 누적 기준으로 유지</b>됩니다. O는 맞은 문항이고, 아래에서 눌러 빨간 X로 바꾼 문항만 오답으로 저장됩니다.</div>
      <div id="grid" class="grid" aria-label="문항별 정오 입력"></div>
      <div class="summary"><div class="sum"><span>예상 점수</span><b id="score">100.0점</b></div><div class="sum"><span>맞은 문항</span><b id="correct">30개</b></div><div class="sum"><span>틀린 문항</span><b id="wrong">0개</b></div></div>
      <button id="saveBtn" class="save" type="button">✅ 성적 저장</button>
      <div id="error" class="err hide"></div>
    </section>
  </main>
  <footer class="ft">학생 직접 입력은 회차당 최대 3회 · 2·3차 연습은 최초 점수와 누적 성적을 바꾸지 않습니다</footer>
</div></div>
<script src="data.js"></script>
<script src="final-last-routes.js?v=20261020-last-entry"></script>
<script src="mock-data-last.js?v=20260823c"></script>
<script src="mock-data-last3.js?v=20260823c"></script>
<script src="mock-data-last4.js?v=20260823c"></script>
<script src="last-score-data.js?v=20261006-last1-cut562"></script>
<script>
(function(){
  'use strict';
  var SB_URL='https://fgahqumaldheqettmvqg.supabase.co';
  var SB_KEY='sb_publishable_OsjJG92BLMaZrc2jTClt0g_ecdTtf_I';
  var params=new URLSearchParams(location.search);
  var rawRound=params.get('round');
  var roundNo=rawRound==null||rawRound===''?1:(/^[1-4]$/.test(rawRound)?Number(rawRound):0);
  var scoreModel=window.GFIELD_LAST_SCORE_DATA||{};
  var round=scoreModel.rounds&&scoreModel.rounds[String(roundNo)];
  var paperRound=window.GFIELD_MOCK_LAST&&window.GFIELD_MOCK_LAST.rounds&&window.GFIELD_MOCK_LAST.rounds[String(roundNo)];
  var ROUND=round&&round.key||('last'+roundNo);
  var SLOT_KEYS=[ROUND,ROUND+'@2',ROUND+'@3'];
  var requestedStudent=(params.get('name')||'').trim();
  var student='';
  try{ student=(localStorage.getItem('gfield_student')||'').trim(); }catch(e){}
  var identityMismatch=!!(student&&requestedStudent&&student!==requestedStudent);
  var D=window.GFIELD_DATA||{};
  var questions=round&&Array.isArray(round.items)?round.items.slice().sort(function(a,b){return a.no-b.no;}):[];
  var wrong={};
  var existing=null,attemptNo=1,activeKey=ROUND;

  function byId(id){return document.getElementById(id);}
  function show(id){byId(id).classList.remove('hide');}
  function hide(id){byId(id).classList.add('hide');}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function round1(n){return Math.round(n*10)/10;}
  function isOnlineMember(name){return !!(name&&D.studentTypes&&D.studentTypes[name]==='online');}
  function isReset(row){return !!(row&&row.source==='reset'&&row.ox==='RESET');}
  function isActive(row){return !!(row&&!isReset(row));}
  function resultUrl(){return 'final.html?set=last&round='+roundNo+'&go=report&attempt='+attemptNo+'&name='+encodeURIComponent(student);}
  function block(icon,html,withResult){
    hide('loading'); hide('entry');
    var box=byId('blocked');
    box.innerHTML='<span class="ico">'+icon+'</span>'+html+(withResult?'<br><a class="link" href="'+resultUrl()+'">📊 최초 성적 확인</a>':'');
    show('blocked');
  }
  function totals(){
    var score=0,wrongCount=0;
    questions.forEach(function(q){ if(wrong[q.no]) wrongCount++; else score+=Number(q.pts)||0; });
    return {score:round1(score),wrong:wrongCount,correct:questions.length-wrongCount};
  }
  function paintSummary(){
    var t=totals();
    byId('score').textContent=t.score.toFixed(1)+'점';
    byId('correct').textContent=t.correct+'개';
    byId('wrong').textContent=t.wrong+'개';
  }
  function renderGrid(){
    byId('grid').innerHTML=questions.map(function(q){return '<button type="button" class="q" data-no="'+q.no+'" aria-pressed="false"><span>'+q.no+'번</span><small>'+Number(q.pts).toFixed(1)+'점 · O</small></button>';}).join('');
    byId('grid').addEventListener('click',function(event){
      var button=event.target.closest('.q'); if(!button)return;
      var no=Number(button.dataset.no); wrong[no]=!wrong[no];
      button.classList.toggle('wrong',!!wrong[no]); button.setAttribute('aria-pressed',wrong[no]?'true':'false');
      button.querySelector('small').textContent=Number(questions[no-1].pts).toFixed(1)+'점 · '+(wrong[no]?'X':'O');
      paintSummary();
    });
  }
  async function fetchSlot(key){
    var url=SB_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(student)
      +'&round=eq.'+encodeURIComponent(key)+'&select=student,round,ox,score,wrong,source,updated_at&order=updated_at.asc&limit=1';
    var response=await fetch(url,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!response.ok) throw new Error('조회 HTTP '+response.status);
    var rows=await response.json(); return rows[0]||null;
  }
  async function fetchSlots(){return Promise.all(SLOT_KEYS.map(fetchSlot));}
  function nextSlot(rows){return rows.findIndex(function(row){return !isActive(row);});}
  function showAttempt(index,rows){
    attemptNo=index+1; activeKey=SLOT_KEYS[index]; existing=rows[index];
    byId('pageTitle').textContent='최종 모의고사 '+roundNo+'회 · '+(attemptNo===1?'최초 성적 입력':attemptNo+'차 연습 입력');
    byId('entryNotice').innerHTML=attemptNo===1
      ?'이번 입력은 <b>최초 성적</b>으로 누적 기준에 반영됩니다. 틀린 문항만 눌러 빨간 X로 바꿔 주세요.'
      :'<b>'+attemptNo+'차 연습 기록</b>입니다. 이미 저장된 최초 점수와 누적 성적은 바뀌지 않습니다. 틀린 문항만 눌러 빨간 X로 바꿔 주세요.';
    byId('saveBtn').textContent='✅ '+(attemptNo===1?'내 최초 성적':'내 '+attemptNo+'차 연습 성적')+' 저장';
  }
  async function save(){
    var button=byId('saveBtn'),error=byId('error'); hide('error'); button.disabled=true;
    try{
      var rows=await fetchSlots();
      if(nextSlot(rows)!==attemptNo-1){ block('🔒','다른 입력이 먼저 저장됐어요.<br>기존 기록은 바꾸지 않았습니다. 새로고침해 다음 연습을 시작해 주세요.',true); return; }
      existing=rows[attemptNo-1];
      var t=totals();
      var wrongNos=questions.filter(function(q){return !!wrong[q.no];}).map(function(q){return q.no;});
      if(!confirm(student+' 학생의 '+(attemptNo===1?'최초 성적':attemptNo+'차 연습 성적')+'을 저장할까요?\n\n점수 '+t.score.toFixed(1)+'점 · 오답 '+t.wrong+'개'+(wrongNos.length?'\n오답: '+wrongNos.join(', ')+'번':'')+'\n\n저장 후 이 기록은 바꿀 수 없고, 연습 성적은 최초 점수에 영향을 주지 않습니다.')) return;
      var ox=questions.map(function(q){return wrong[q.no]?'X':'O';}).join('');
      var payload={student:student,round:activeKey,ox:ox,score:t.score,wrong:t.wrong,source:attemptNo===1?(isOnlineMember(student)?'online':'parent'):'practice',updated_at:new Date().toISOString()};
      var saveUrl=SB_URL+'/rest/v1/mock_results';
      var method='POST',prefer='return=minimal';
      if(isReset(existing)){
        method='PATCH'; prefer='return=representation';
        saveUrl+='?student=eq.'+encodeURIComponent(student)+'&round=eq.'+encodeURIComponent(activeKey)+'&source=eq.reset&ox=eq.RESET&select=round';
      }
      var response=await fetch(saveUrl,{method:method,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:prefer},body:JSON.stringify(payload)});
      if(response.status===409){ block('🔒','다른 입력이 먼저 기록됐어요.<br>먼저 저장된 기록을 유지했습니다.',true); return; }
      if(!response.ok) throw new Error('저장 HTTP '+response.status);
      if(method==='PATCH'){
        var changed=await response.json();
        if(!Array.isArray(changed)||changed.length!==1){ block('🔒','다른 입력이 먼저 기록됐어요.<br>먼저 저장된 기록을 유지했습니다.',true); return; }
      }
      block('✅',attemptNo===1?'최초 성적을 저장했습니다.<br>이 기록이 통합 석차 백분율에 반영됩니다.':attemptNo+'차 연습 성적을 저장했습니다.<br>최초 점수와 누적 성적은 그대로 유지됩니다.',true);
    }catch(e){ error.textContent='성적을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요. ('+e.message+')'; show('error'); }
    finally{ button.disabled=false; }
  }
  async function boot(){
    if(!roundNo){ block('🔒','주소의 회차가 올바르지 않습니다.<br>최종 모의고사 1~4회 중 하나를 선택해 주세요.',false); return; }
    document.title='최종 모의고사 '+roundNo+'회 성적 입력 | 지필드 영재교육';
    byId('pageTitle').textContent='최종 모의고사 '+roundNo+'회 성적 입력';
    if(!paperRound||paperRound.ready!==true){ block('🔒','최종 '+roundNo+'회는 현재 검수 대기 중입니다.<br>시험 공개 후 최초 성적을 입력할 수 있습니다.',false); return; }
    if(!student){ block('🔐','홈페이지에서 학생 이름으로 로그인한 뒤 다시 열어 주세요.',false); return; }
    if(identityMismatch){ block('🔒','현재 로그인한 학생과 요청한 이름이 다릅니다.<br>홈페이지에서 본인 계정으로 다시 열어 주세요.',false); return; }
    byId('studentName').textContent=student+' 학생'; show('member');
    var routes=window.GFIELD_FINAL_LAST_ROUTES;
    if(!routes||!routes.accessAllowed(D,student,'last',roundNo)){ block('🔒','이 회차의 학생 열람 권한을 확인하지 못했습니다.',false); return; }
    if(!round||questions.length!==30){ block('🔒','아직 최종 '+roundNo+'회 입력이 열리지 않았습니다.',false); return; }
    try{
      var rows=await fetchSlots(),index=nextSlot(rows);
      if(index<0){ attemptNo=1; block('📌','이 회차는 최초 응시와 2·3차 연습까지 모두 기록했습니다.<br>최초 성적은 그대로 유지됩니다.',true); return; }
      showAttempt(index,rows);
    }catch(e){ block('⚠️','최초 성적을 확인하지 못했습니다.<br>네트워크 상태를 확인한 뒤 새로고침해 주세요.',false); return; }
    hide('loading'); renderGrid(); paintSummary(); show('entry');
  }
  byId('saveBtn').addEventListener('click',save);
  boot();
})();
</script>
</body>
</html>
