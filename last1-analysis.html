<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최종 모의고사 약점 유형 분석지 | 지필드 영재교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#eef1f6;color:#1f2430;line-height:1.5;padding:20px 14px}
.panel{max-width:1180px;margin:0 auto 18px;background:#fff;border-radius:14px;box-shadow:0 6px 22px rgba(30,60,114,.10);padding:20px 22px}
.panel h3{font-size:15px;font-weight:800;color:#1e3c72;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.row>div{flex:1;min-width:150px}
label{display:block;font-size:12px;font-weight:800;color:#5b6474;margin-bottom:6px}
input{width:100%;padding:9px 12px;border:1.5px solid #e3e8ef;border-radius:9px;font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:#2a5298}
input[readonly]{background:#f7f9fc;color:#536173;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-bottom:8px}
.q{border:1.5px solid #e3e8ef;border-radius:9px;padding:7px 3px 5px;text-align:center;cursor:pointer;background:#fff;user-select:none}
.q .n{font-size:13.5px;font-weight:800}
.q .r{display:block;font-size:9px;font-weight:700;color:#98a1b0;margin-top:2px}
.q.x{background:#fde8e8;border-color:#dc2626}
.q.x .n,.q.x .r{color:#dc2626}
.hint{font-size:11.5px;color:#8a94a6;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.72}
.pri{background:linear-gradient(135deg,#2a5298,#1e3c72);color:#fff}
.sec{background:#f1f4f9;color:#5b6474;border:1px solid #e3e8ef}
.adm{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:700;margin-bottom:14px;line-height:1.6}
.cum-label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sync-btn{padding:5px 10px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;font-size:11px;border-radius:7px}
.sync-status{font-size:11px;color:#64748b;margin:-5px 0 10px;min-height:17px}

/* ===== 분석지 ===== */
#sheet{max-width:1180px;margin:0 auto;background:#fff;padding:26px 30px 34px;box-shadow:0 6px 22px rgba(30,60,114,.10);border-radius:6px}
.rpt-h{background:#1f3864;color:#fff;text-align:center;padding:12px;font-size:21px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.idbar{display:flex;border:1px solid #b9c4d4;border-top:none;font-size:12.5px}
.idbar>div{display:flex;flex:1;border-right:1px solid #dbe2ec}
.idbar>div:last-child{border-right:none}
.idbar .k{background:#f2f5fa;font-weight:800;padding:7px 10px;min-width:60px;text-align:center;border-right:1px solid #dbe2ec;white-space:nowrap}
.idbar .v{flex:1;padding:7px 10px;text-align:center}
.idbar .v.hl{background:#ffff00;font-weight:800}
tbl{}
.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.res th{background:#f2f5fa;border:1px solid #b9c4d4;padding:7px;font-weight:800}
.res td{border:1px solid #b9c4d4;padding:9px 7px;text-align:center}
.res td.big{font-size:19px;font-weight:800;color:#1f3864}
.res td.nm{font-size:14px;font-weight:800}

.qt{width:100%;border-collapse:collapse;margin-top:14px;font-size:11.5px}
.qt th{background:#eef2f8;border:1px solid #b9c4d4;padding:6px 4px;font-weight:800;font-size:11px}
.qt td{border:1px solid #d7dfea;padding:4px 6px}
.qt td.c{text-align:center}
.qt tr.odd td{background:#fafbfd}
.qt .ox{font-weight:800;width:52px;text-align:center}
.qt .ox.x{background:#fbdada;color:#c00}
.qt .no{width:52px;text-align:center;background:#f2efe6;font-weight:700}
.qt .rate{width:118px}
.qt .rb{display:flex;align-items:center;gap:5px}
.qt .rb i{display:block;height:11px;background:#4472c4;border-radius:1px}
.qt .rb b{font-size:10.5px;color:#333;font-weight:700}
.qt .cat{width:96px;text-align:center;background:#f7f6f0}
.qt .typ{background:#f7f6f0}
.qt .pt{width:52px;text-align:center}

h2.sec-t{font-size:19px;font-weight:800;color:#2f6fb5;margin:22px 0 8px}
.dt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.dt th{background:#dbe6f3;border:1px solid #b9c4d4;padding:6px;font-weight:800}
.dt td{border:1px solid #b9c4d4;padding:6px;text-align:center}
.dt td.k{background:#eef2f8;font-weight:800}
.dt tr.sum td{background:#f2f5fa;font-weight:800}

.cum{width:100%;border-collapse:collapse;font-size:12px}
.cum th{background:#f2f2f2;border:1px solid #c9c9c9;padding:8px;font-weight:800}
.cum td{border:1px solid #c9c9c9;padding:8px;text-align:center;color:#7a7a7a}
.cum td.k{background:#f6f6f6;color:#333;font-weight:700;width:96px}
.cum td.on{color:#1f2430}
.cum td.tot{background:#fdece0;color:#1f2430;font-weight:800;font-size:17px;vertical-align:middle}
.cum td.tot.lv{font-size:15px}

.btm{display:flex;gap:20px;margin-top:18px;align-items:flex-start;flex-wrap:wrap}
.radar{flex:0 0 340px}
.cmt{flex:1;min-width:320px;font-size:11.8px;line-height:1.62;white-space:pre-wrap;color:#1f2430}
@media(max-width:640px){
  body{padding:10px 6px}.panel{padding:16px 12px}.row{gap:8px}.row>div{min-width:132px}
  #sheet{padding:14px 8px;overflow:hidden}.rpt-h{font-size:16px;padding:10px 6px}
  .idbar{display:grid;grid-template-columns:1fr 1fr}.idbar>div{min-width:0;border-bottom:1px solid #dbe2ec}.idbar>div:nth-child(2n){border-right:none}.idbar .k{min-width:48px;padding:6px 5px}.idbar .v{min-width:0;padding:6px 5px}
  .res,.qt,.dt,.cum{table-layout:fixed}.res{font-size:10px}.res th,.res td{padding:5px 3px}.res td.big{font-size:13px}.res td.nm{font-size:11px;word-break:keep-all}
  .qt{font-size:9px}.qt th{font-size:8.5px;padding:4px 2px}.qt td{padding:3px 2px}.qt .no{width:29px}.qt .ox{width:28px}.qt .rate{width:58px}.qt .cat{width:53px;word-break:keep-all}.qt .pt{width:28px}.qt .typ{word-break:keep-all}.qt .rb{gap:2px}.qt .rb i{display:none}.qt .rb b{font-size:8.5px}
  h2.sec-t{font-size:16px}.dt{font-size:9px}.dt th,.dt td{padding:4px 2px;word-break:keep-all}.cum{font-size:8px}.cum th,.cum td{padding:5px 2px;word-break:keep-all}.cum td.k{width:auto}.cum td.tot{font-size:12px}.cum td.tot.lv{font-size:10px}
  .radar{flex:1 1 100%;max-width:340px;margin:0 auto}.cmt{min-width:0;font-size:10.5px}.btm{gap:8px}
}
@media print{body{background:#fff;padding:0}.panel{display:none}#sheet{box-shadow:none;border-radius:0;padding:10px}}
</style></head><body>

<div class="panel">
<div class="adm">🧑‍🏫 재원생 성적 기록 화면입니다. 온라인 회원은 학생 화면에서 직접 입력하고, 재원생은 선생님이 대신 기록할 수 있습니다. 누적에는 입력 주체와 관계없이 회차별 최초 성적만 반영됩니다.</div>
<h3>① 학생 정보와 오답 입력</h3>
<div class="row">
  <div><label>이름</label><input id="nm" placeholder="학생 이름" onchange="loadPriorPercentiles(true)"></div>
  <div><label>학교</label><input id="sch" placeholder="0"></div>
  <div><label>학년</label><input id="grd" placeholder="0"></div>
  <div><label>담임</label><input id="tch" value="노관호"></div>
</div>
<label class="cum-label"><span id="cumSourceLabel">이전 최초 응시 석차 백분율 (중앙 기록 자동 연결 · 단위 %)</span><button type="button" class="sync-btn" onclick="loadPriorPercentiles(true)">🔄 최초 성적 연결</button></label>
<div class="row" style="margin-bottom:10px">
  <div id="priorBox1"><label id="priorLabel1" style="font-weight:600">파이널 1회</label><input id="f1" type="number" min="0" max="100" step="0.1" readonly></div>
  <div id="priorBox2"><label id="priorLabel2" style="font-weight:600">파이널 2회</label><input id="f2" type="number" min="0" max="100" step="0.1" readonly></div>
  <div id="priorBox3"><label id="priorLabel3" style="font-weight:600">파이널 3회</label><input id="f3" type="number" min="0" max="100" step="0.1" readonly></div>
  <div id="priorBox4"><label id="priorLabel4" style="font-weight:600">파이널 4회</label><input id="f4" type="number" min="0" max="100" step="0.1" readonly></div>
</div>
<div id="priorStatus" class="sync-status">학생 이름이 있으면 중앙 기록의 파이널 최초 응시 성적을 자동으로 연결합니다. 없는 회차는 어드민의 파이널 모의고사에서 선생님이 기록할 수 있습니다.</div>
<label>틀린 문항 (누르면 오답)</label>
<div class="grid" id="grid"></div>
<div class="hint">숫자 아래는 제공받은 최종 정답률입니다. 오답만 고르면 점수·석차·수행률·누적·멘트가 자동 계산됩니다.</div>
<div class="btns">
  <button id="analysisBtn" class="pri" onclick="render()">분석지 만들기</button>
  <button id="analysisPrintBtn" class="sec" onclick="window.print()">인쇄 / PDF 저장</button>
  <button id="copyBtn" class="sec" onclick="copyCmt()">멘트만 복사</button>
  <button id="sendBtn" class="sec" style="background:#fee500;color:#3b1e1e;border-color:#f5d800" onclick="sendTeacher()">📩 카톡으로 멘트 보내기</button>
  <button id="publishBtn" class="sec" style="background:#dcfce7;color:#166534;border-color:#bbf7d0" onclick="publish()">✅ 재원생 최초 성적 기록</button>
  <button class="sec" onclick="reset()">초기화</button>
</div>
</div>

<div id="sheet"></div>

<script src="mock-data-final.js"></script>
<script src="mock-data-last.js?v=20260823c"></script>
<script src="mock-data-last3.js?v=20260823c"></script>
<script src="mock-data-last4.js?v=20260823c"></script>
<script src="last-score-data.js?v=20260823c"></script>
<script>
/* ===== 최종 1~4회 공통 데이터 ===== */
const pageParams=new URLSearchParams(location.search);
const rawRound=pageParams.get('round');
const roundNo=rawRound==null||rawRound===''?1:(/^[1-4]$/.test(rawRound)?Number(rawRound):null);
const SCORE_MODEL=window.GFIELD_LAST_SCORE_DATA;
const ROUND_DATA=roundNo&&SCORE_MODEL&&SCORE_MODEL.rounds&&SCORE_MODEL.rounds[String(roundNo)];
const PAPER_ROUND=roundNo&&window.GFIELD_MOCK_LAST&&window.GFIELD_MOCK_LAST.rounds&&window.GFIELD_MOCK_LAST.rounds[String(roundNo)];
if(!ROUND_DATA||!Array.isArray(ROUND_DATA.items)||ROUND_DATA.items.length!==30||!Array.isArray(ROUND_DATA.rates)||ROUND_DATA.rates.length!==30){
  document.body.innerHTML='<div style="max-width:620px;margin:80px auto;background:#fff;border-radius:16px;padding:32px;text-align:center;box-shadow:0 8px 28px rgba(30,60,114,.12)"><h1 style="font-size:22px;color:#1e3c72;margin-bottom:10px">🔒 회차를 확인해 주세요</h1><p style="color:#64748b">최종 모의고사 1~4회 중 올바른 회차를 지정해 주세요.</p></div>';
  throw new Error('유효하지 않거나 불완전한 최종 모의고사 성적 기준입니다.');
}
const ROUND_KEY=ROUND_DATA.key;
const TITLE=ROUND_DATA.title;
const AVG=ROUND_DATA.average;
const TYPES=ROUND_DATA.items.map(item=>item.type);
const AREA=ROUND_DATA.items.map(item=>item.area);
const RATE=ROUND_DATA.rates;
const PTS=ROUND_DATA.items.map(item=>item.pts);
const AREAS=['수·규칙찾기','도형','경우의 수','식의 계산'];
const TB=ROUND_DATA.percentileTable||null;
const CUTS=ROUND_DATA.scoreBands;
const CUM=ROUND_DATA.cumulativeBands;
const REVIEW_NOTE=ROUND_DATA.reviewNote;
const VALIDATION_LOCK=Object.freeze({
  active:!PAPER_ROUND||PAPER_ROUND.ready!==true,
  reasons:Object.freeze((PAPER_ROUND&&PAPER_ROUND.lockedQuestions||[]).map(no=>no+'번 문항 검수 대기'))
});
const ITEM_STATUS=Object.freeze({});

const R1=n=>Math.round(n*10)/10;
let X={};
let priorLoadVersion=0;
let priorLoadState='idle';

const publishBtn=document.getElementById('publishBtn');
publishBtn.disabled=VALIDATION_LOCK.active;
publishBtn.textContent=VALIDATION_LOCK.active?'🔒 학생 성적 공개 잠금':'✅ 재원생 최초 성적 기록';
publishBtn.title=VALIDATION_LOCK.active?VALIDATION_LOCK.reasons.join(' · '):'';
['analysisBtn','analysisPrintBtn','copyBtn','sendBtn'].forEach(id=>{
  const btn=document.getElementById(id);
  if(btn){ btn.disabled=VALIDATION_LOCK.active; btn.title=VALIDATION_LOCK.reasons.join(' · '); }
});

const grid=document.getElementById('grid');
for(let i=1;i<=30;i++){
  const d=document.createElement('div'); d.className='q'; d.dataset.i=i;
  const itemStatus=ITEM_STATUS[i];
  if(itemStatus) d.classList.add('pending');
  d.innerHTML=`<span class="n">${i}</span><span class="r">${itemStatus||(RATE[i-1]*100).toFixed(1)+'%'}</span>`;
  d.onclick=()=>{ X[i]=!X[i]; d.classList.toggle('x',X[i]); invalidateComment(); };
  grid.appendChild(d);
}
/* ===== 재원생 최초 성적 기록 =====
   mock_results 테이블의 회차별 기본 키를 최초 한 번만 생성한다.
   이미 유효한 기록은 덮지 않고, 정확한 reset 행만 조건부 PATCH로 다시 연다. */
async function loadOfficialRound(nm){
  const url=AL_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(nm)
    +'&round=eq.'+ROUND_KEY+'&select=student,round,ox,score,wrong,source,updated_at&order=updated_at.asc&limit=1';
  const response=await fetch(url,{headers:{apikey:AL_KEY,Authorization:'Bearer '+AL_KEY}});
  if(!response.ok) throw new Error('조회 HTTP '+response.status);
  const rows=await response.json();
  return rows[0]||null;
}
function isResetOfficial(row){ return !!(row&&row.source==='reset'&&row.ox==='RESET'); }
function isActiveOfficial(row){ return !!(row&&!isResetOfficial(row)); }
async function publish(){
  if(VALIDATION_LOCK.active){
    alert('학생 성적 공개가 잠겨 있습니다.\n\n- '+VALIDATION_LOCK.reasons.join('\n- ')+'\n\n오답 문항 입력만 미리 준비할 수 있습니다.');
    return;
  }
  const nm=document.getElementById('nm').value.trim();
  if(!nm){ alert('먼저 학생 이름을 입력해 주세요.'); return; }
  let score=0, ox='';
  for(let i=1;i<=30;i++){ if(X[i]) ox+='X'; else { ox+='O'; score+=PTS[i-1]; } }
  score=R1(score);
  const wrong=Object.keys(X).filter(k=>X[k]).length;
  try{
    const existing=await loadOfficialRound(nm);
    if(isActiveOfficial(existing)){
      alert(nm+' 학생의 최종 '+roundNo+'회 최초 성적이 이미 기록되어 있습니다.\n\n기존 최초 성적은 덮어쓰지 않았습니다. 정정이 필요한 경우 먼저 해당 기록을 초기화해 주세요.');
      return;
    }
    if(!confirm(nm+' 학생의 최초 성적을 기록할까요?\n\n점수 '+score+'점 · 오답 '+wrong+'개\n\n기록 후에는 일반 저장으로 덮어쓸 수 없습니다.')) return;
    const payload={student:nm,round:ROUND_KEY,ox:ox,score:score,wrong:wrong,source:'admin',updated_at:new Date().toISOString()};
    let saveUrl=AL_URL+'/rest/v1/mock_results';
    let method='POST', prefer='return=minimal';
    if(isResetOfficial(existing)){
      method='PATCH'; prefer='return=representation';
      saveUrl+='?student=eq.'+encodeURIComponent(nm)+'&round=eq.'+ROUND_KEY+'&source=eq.reset&ox=eq.RESET&select=round';
    }
    const r=await fetch(saveUrl,{method:method,
      headers:{apikey:AL_KEY,Authorization:'Bearer '+AL_KEY,'Content-Type':'application/json',
               Prefer:prefer},
      body:JSON.stringify(payload)});
    if(r.status===409){ alert('다른 입력이 먼저 최초 성적으로 기록되었습니다. 기존 기록을 유지했습니다.'); return; }
    if(!r.ok) throw new Error('저장 HTTP '+r.status);
    if(method==='PATCH'){
      const changed=await r.json();
      if(!Array.isArray(changed)||changed.length!==1){ alert('다른 입력이 먼저 최초 성적으로 기록되었습니다. 기존 기록을 유지했습니다.'); return; }
    }
    alert(nm+' 학생의 최종 '+roundNo+'회 최초 성적이 기록되었습니다.\n학생 화면의 해당 최종 모의고사 [성적 확인]에서 볼 수 있어요.');
  }catch(e){
    alert('성적 기록에 실패했습니다. 잠시 후 다시 시도해 주세요.\n('+e.message+')');
  }
}
function reset(){ X={}; LAST_CMT=''; document.querySelectorAll('.q').forEach(d=>d.classList.remove('x')); document.getElementById('sheet').innerHTML=''; }
function gradeForScore(s){ for(const c of CUTS) if(s>=c[1]) return c[0]; return '노력요함'; }
function percentileForLast(targetRound,score){
  const data=SCORE_MODEL&&SCORE_MODEL.rounds&&SCORE_MODEL.rounds[String(targetRound)];
  if(!data||!Number.isFinite(score)) return null;
  if(Array.isArray(data.percentileTable)){
    for(const row of data.percentileTable) if(score>=row[0]) return R1(row[1]);
    return R1(data.percentileTable[data.percentileTable.length-1][1]);
  }
  if(!Array.isArray(data.scoreDist)||!Number.isFinite(data.cohortSize)||data.cohortSize<=0) return null;
  return R1((data.scoreDist.filter(value=>value>score).length+1)/data.cohortSize*100);
}
function lookup(s){ return [percentileForLast(roundNo,s)??100,gradeForScore(s)]; }
function cumLevel(p){ for(const c of CUM) if(p<=c[0]) return c[1]; return '노력요함'; }
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

let LAST_CMT='';
function invalidateComment(){ LAST_CMT=''; }
['nm','sch','grd','tch','f1','f2','f3','f4'].forEach(id=>{
  const input=document.getElementById(id);
  if(input) input.addEventListener('input',invalidateComment);
});
function render(){
  if(VALIDATION_LOCK.active){
    alert('검수 완료 전에는 점수·석차·수행률 분석을 산출하지 않습니다.');
    return;
  }
  const nm=document.getElementById('nm').value.trim()||'○○○';
  const sch=document.getElementById('sch').value.trim()||'0';
  const grd=document.getElementById('grd').value.trim()||'0';
  const tch=document.getElementById('tch').value.trim()||'노관호';

  let score=0, ncorr=0;
  for(let i=1;i<=30;i++){ if(!X[i]){ score+=PTS[i-1]; ncorr++; } }
  score=R1(score);
  const [pct,grade]=lookup(score);
  const wrong=[]; for(let i=1;i<=30;i++) if(X[i]) wrong.push(i);
  /* 우선 복습 권장 문항: 오답 중 전체 정답률이 현재 상위 백분율보다 높은 문항 */
  const miss=wrong.filter(i=>Number.isFinite(RATE[i-1])&&RATE[i-1]*100>pct);

  /* 문항표 */
  let qrows='';
  for(let i=1;i<=30;i++){
    const x=!!X[i], r=RATE[i-1], itemStatus=ITEM_STATUS[i];
    qrows+=`<tr class="${i%2?'odd':''}"><td class="no">${i}</td>`+
      `<td class="ox ${x?'x':''}">${x?'X':'O'}</td>`+
      `<td class="rate">${itemStatus?`<span class="rb"><b>${itemStatus}</b></span>`:`<span class="rb"><i style="width:${Math.max(2,r*88)}px"></i><b>${(r*100).toFixed(1)}%</b></span>`}</td>`+
      `<td class="cat">${AREA[i-1]}</td><td class="typ">${TYPES[i-1]}</td><td class="pt">${PTS[i-1]}</td></tr>`;
  }

  /* 영역별 */
  const ag=AREAS.map(k=>{
    let n=0,cor=0,tot=0,got=0;
    for(let i=1;i<=30;i++){ if(AREA[i-1]!==k) continue; n++; tot+=PTS[i-1]; if(!X[i]){cor++; got+=PTS[i-1];} }
    return {k,n,cor,tot:R1(tot),got:R1(got),cnt:n?cor/n*100:0,perf:tot?got/tot*100:0};
  });
  let arows=ag.map(a=>`<tr><td class="k">${a.k}</td><td>${a.n}</td><td>${a.cor}</td><td>${a.cnt.toFixed(1)}%</td><td>${a.tot}</td><td>${a.got}</td><td>${a.perf.toFixed(1)}%</td></tr>`).join('');
  arows+=`<tr class="sum"><td class="k">합계</td><td>30</td><td>${ncorr}</td><td>${(ncorr/30*100).toFixed(1)}%</td><td>100</td><td>${score}</td><td>${score.toFixed(1)}%</td></tr>`;

  /* 배점대별 */
  const tiers=[2.7,3.4,4.2];
  const tg=tiers.map(t=>{
    let n=0,cor=0,tot=0,got=0;
    for(let i=1;i<=30;i++){ if(PTS[i-1]!==t) continue; n++; tot+=t; if(!X[i]){cor++; got+=t;} }
    return {t,n,tot:R1(tot),cor,got:R1(got),perf:tot?got/tot*100:0};
  });
  const trow=(lab,f,tot)=>`<tr><td class="k">${lab}</td>${tg.map(g=>`<td>${f(g)}</td>`).join('')}<td class="k">${tot}</td></tr>`;

  /* 놓친 점수 시뮬레이션 (파이널 로직 동일) */
  const gain=R1(miss.reduce((s,i)=>s+PTS[i-1],0));
  const newScore=R1(score+gain);
  const [newPct]=lookup(newScore);

  /* 컷까지 최단 경로: 오답 중 정답률 높은 순으로 채움 */
  let curIdx=CUTS.findIndex(c=>score>=c[1]); if(curIdx<0)curIdx=CUTS.length-1;
  let path=null;
  if(curIdx>0){
    const target=CUTS[curIdx-1], need=R1(target[1]-score);
    const cand=wrong.filter(i=>Number.isFinite(RATE[i-1])).sort((a,b)=>RATE[b-1]-RATE[a-1]);
    let acc=0, pick=[];
    for(const i of cand){ if(acc>=need) break; pick.push(i); acc=R1(acc+PTS[i-1]); }
    if(acc>=need) path={grade:target[0], cut:target[1], need, pick, acc};
  }

  /* 누적: 최종 1회는 파이널 1~4회 포함, 최종 2회부터는 최종 모의고사 최초 성적만 반영 */
  const priorCount=roundNo===1?4:roundNo-1;
  const priorEntries=[...Array(priorCount)].map((_,index)=>({index,value:parseFloat(document.getElementById('f'+(index+1)).value)}))
    .filter(entry=>Number.isFinite(entry.value)&&entry.value>=0&&entry.value<=100);
  const fps=priorEntries.map(entry=>entry.value);
  const cumulativeAvailable=priorLoadState==='loaded';
  const allP=cumulativeAvailable?[...fps, pct]:[];
  const cumAvg=cumulativeAvailable?R1(allP.reduce((s,v)=>s+v,0)/allP.length):null;
  const cumLv=cumulativeAvailable?cumLevel(cumAvg):'판정 보류';

  const cumulativeCells=Array(8).fill(null);
  if(roundNo===1){
    priorEntries.forEach(entry=>{ cumulativeCells[entry.index]=entry.value; });
    cumulativeCells[4]=pct;
  }else{
    priorEntries.forEach(entry=>{ cumulativeCells[4+entry.index]=entry.value; });
    cumulativeCells[3+roundNo]=pct;
  }
  const currentCellIndex=roundNo===1?4:3+roundNo;
  const cumulativeScoreCells=cumulativeCells.map(value=>`<td class="${value==null?'':'on'}">${value==null?'':value.toFixed(1)+'%'}</td>`).join('');
  const cumulativeGradeCells=cumulativeCells.map((value,index)=>`<td class="${index===currentCellIndex?'on':''}">${index===currentCellIndex?grade:''}</td>`).join('');
  const cumulativeSource=!cumulativeAvailable
    ?'이전 성적 연결이 완료되지 않아 누적 판정을 보류합니다.'
    :roundNo===1
    ?`파이널 최초 성적 ${fps.length}회와 최종 1회 최초 성적`
    :`최종 1회부터 ${roundNo}회까지 확인된 최초 성적 ${allP.length}회`;

  /* 멘트 */
  const wt=wrong.length?`[${wrong.map(n=>n+'번').join(', ')}]`:'없습니다';
  const kt=miss.length?`[${miss.map(n=>n+'번').join(', ')}]`:'';
  let c=`${nm} 학생이 응시한 모의고사는 [${TITLE}]입니다.\n`;
  c+=`${nm} 학생은 이번 모의고사에서 ${score.toFixed(1)}점을 획득했고, 총 30문항 중 ${ncorr}개를 맞추었습니다.\n`;
  c+=`${SCORE_MODEL.dataProof}를 기준으로 예상 상위 백분율은 ${pct.toFixed(1)}%이며, [${grade}] 구간입니다.\n`;
  c+=`오답 문항은 ${wt}입니다.\n`;
  if(miss.length) c+=`전체 정답률을 기준으로 우선 복습할 문항은 ${kt}입니다. 이 문항들은 정답만 확인하지 말고 풀이 과정과 해설 영상을 함께 복습해 주세요.\n`;
  if(miss.length) c+=`해당 문항을 보완하면 산술상 ${newScore.toFixed(1)}점, 상위 ${newPct.toFixed(1)}%까지 향상될 수 있습니다.\n`;
  if(path) c+=`다음 목표 구간인 [${path.grade}]까지는 ${path.need.toFixed(1)}점이 필요합니다. 우선 복습 순서는 ${path.pick.map(n=>n+'번').join(', ')}이며, 목표 기준 점수는 ${path.cut}점입니다.\n`;
  if(cumulativeAvailable&&fps.length) c+=`${cumulativeSource}의 상위 백분율 평균은 ${cumAvg.toFixed(1)}%로, 누적 기준 [${cumLv}] 구간입니다.\n`;
  c+=`풀이 강의와 반복 학습을 통해 문제의 조건, 풀이 순서, 검산 과정을 정확히 익히는 것이 중요합니다. 황소 경시 실전 대비에도 도움이 됩니다.\n`;
  c+=REVIEW_NOTE;
  LAST_CMT=c;

  document.getElementById('sheet').innerHTML=`
<div class="rpt-h">G-FIELD 영재교육 약점 유형 분석<br>${TITLE}</div>
<div class="idbar">
  <div><span class="k">학 교</span><span class="v">${esc(sch)}</span></div>
  <div><span class="k">학 년</span><span class="v">${esc(grd)}</span></div>
  <div><span class="k">담 임</span><span class="v">${esc(tch)}</span></div>
  <div><span class="k">이 름</span><span class="v hl">${esc(nm)}</span></div>
</div>
<table class="res">
<tr><th style="width:48%">분 류</th><th colspan="3">결 과</th></tr>
<tr><th>TEST NAME</th><th style="width:14%">점수 / 평균</th><th style="width:12%">맞은개수 /<br>문항수</th><th>석차</th></tr>
<tr><td class="nm">${TITLE}</td><td>${score.toFixed(1)} / (${AVG.toFixed(1)})</td><td>${ncorr} / 30</td><td class="big">${pct.toFixed(1)}% / ${grade}</td></tr>
</table>

<tr><th>문항번호</th><th>O X</th><th>정답률</th><th>분 류</th><th>유 형</th><th>배점</th></tr>
${qrows}
</table>

<h2 class="sec-t">세부 분석</h2>

</table>

${trow('점수대별 문항 수', g=>g.n, 30)}
${trow('총점', g=>g.tot, 100)}
${trow('득점 개수', g=>g.cor, ncorr)}
${trow('득점', g=>g.got, score.toFixed(1))}

<tr>
<td>${miss.length?`<b>${miss.map(n=>n+'번').join(', ')}</b> (+${gain}점)<br>→ <b style="font-size:15px;color:#1f3864">${newScore.toFixed(1)}점 · 석차 ${newPct.toFixed(1)}%</b>`:'해당 문항 없음'}</td>
<td>${path?`<b>[${path.grade}]</b>까지 ${path.need.toFixed(1)}점 부족<br>→ <b style="color:#c2410c">${path.pick.map(n=>n+'번').join(', ')}</b>만 잡으면 진입`:'최상위 구간입니다'}</td>
<td><b style="font-size:15px">${score.toFixed(1)}점</b><br>${grade} (상위 ${pct.toFixed(1)}%)</td>
</tr>
</table>

<h2 class="sec-t">누적 성적 결과</h2>
<table class="cum">
<tr><th style="width:96px"></th><th>파이널1회</th><th>파이널2회</th><th>파이널3회</th><th>파이널4회</th><th>최종1회</th><th>최종2회</th><th>최종3회</th><th>최종4회</th><th style="width:170px">누적</th></tr>
<tr><td class="k">상위 백분율</td>${cumulativeScoreCells}<td class="tot" rowspan="2">${cumAvg==null?'—':cumAvg.toFixed(1)+'%'}</td></tr>
<tr><td class="k">예상 구간</td>${cumulativeGradeCells}</tr>
<tr><td class="k">누적 판정</td><td colspan="8" style="text-align:right;color:#8a94a6;font-size:11px">${cumulativeAvailable?'각 회차 최초 성적의 상위 백분율 평균 · ':''}${cumulativeSource}</td><td class="tot lv">${cumLv}</td></tr>
</table>

<div class="btm">
  <div class="radar">${radarSVG(ag)}</div>
  <div class="cmt">${esc(c)}</div>
</div>`;
  logSubmit(nm, score.toFixed(1), pct.toFixed(1), wrong);
  document.getElementById('sheet').scrollIntoView({behavior:'smooth'});
}

function radarSVG(ag){
  const cx=170,cy=160,R=105, n=ag.length;
  const ang=i=>-Math.PI/2 + i*2*Math.PI/n;
  const P=(i,r)=>[cx+Math.cos(ang(i))*R*r, cy+Math.sin(ang(i))*R*r];
  let g='';
  for(let k=1;k<=7;k++){
    const r=k/7, pts=[...Array(n)].map((_,i)=>P(i,r).join(',')).join(' ');
    g+=`<polygon points="${pts}" fill="none" stroke="#d8d8d8" stroke-width="1"/>`;
  }
  for(let i=0;i<n;i++){ const [x,y]=P(i,1); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d8d8d8"/>`; }
  const pts=ag.map((a,i)=>P(i,Math.min(1,a.perf/70)).join(',')).join(' ');
  g+=`<polygon points="${pts}" fill="rgba(70,120,200,.12)" stroke="#4472c4" stroke-width="2"/>`;
  ag.forEach((a,i)=>{ const [x,y]=P(i,Math.min(1,a.perf/70)); g+=`<circle cx="${x}" cy="${y}" r="3" fill="#4472c4"/>`; });
  ag.forEach((a,i)=>{
    const [x,y]=P(i,1.22);
    g+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" font-weight="700" fill="#333">${a.k}</text>`+
       `<text x="${x}" y="${y+13}" text-anchor="middle" font-size="10" fill="#4472c4" font-weight="700">${a.perf.toFixed(0)}%</text>`;
  });
  for(let k=1;k<=7;k++) g+=`<text x="${cx-4}" y="${cy-R*k/7+3}" text-anchor="end" font-size="8" fill="#999">${(k*10).toFixed(0)}%</text>`;
  return `<div style="font-size:12px;font-weight:800;text-align:center;color:#333;margin-bottom:2px">영역별 수행률</div>
  <svg viewBox="0 0 340 330" width="100%">${g}</svg>`;
}

function finalRoundPercentile(roundNo, score){
  const model=window.GFIELD_MOCK_FINAL;
  const stats=model&&model.rounds&&model.rounds[String(roundNo)]&&model.rounds[String(roundNo)].stats;
  if(!stats||!Array.isArray(stats.dist)||!Number.isFinite(stats.n)||stats.n<=0||!Number.isFinite(score)) return null;
  const higher=stats.dist.filter(v=>v>score).length;
  return R1((higher+1)/stats.n*100);
}
function configurePriorInputs(){
  document.title=`최종 ${roundNo}회 약점 유형 분석지 | 지필드 영재교육`;
  const sourceLabel=document.getElementById('cumSourceLabel');
  const status=document.getElementById('priorStatus');
  for(let k=1;k<=4;k++){
    const box=document.getElementById('priorBox'+k);
    const label=document.getElementById('priorLabel'+k);
    const visible=roundNo===1||k<roundNo;
    box.style.display=visible?'':'none';
    if(visible) label.textContent=roundNo===1?`파이널 ${k}회`:`최종 ${k}회`;
  }
  sourceLabel.textContent=roundNo===1
    ?'파이널 1~4회 최초 응시 상위 백분율 (중앙 기록 자동 연결 · 단위 %)'
    :'이전 최종 모의고사 최초 응시 상위 백분율 (중앙 기록 자동 연결 · 단위 %)';
  status.textContent=roundNo===1
    ?'학생 이름이 있으면 중앙 기록의 파이널 최초 응시 성적을 연결합니다.'
    :`학생 이름이 있으면 중앙 기록의 최종 1~${roundNo-1}회 최초 성적을 연결합니다.`;
}
async function loadPriorPercentiles(clearFirst){
  const requestVersion=++priorLoadVersion;
  const nm=document.getElementById('nm').value.trim();
  const status=document.getElementById('priorStatus');
  const inputs=[1,2,3,4].map(k=>document.getElementById('f'+k));
  if(clearFirst) inputs.forEach(input=>{ input.value=''; delete input.dataset.auto; });
  invalidateComment();
  if(!nm){ priorLoadState='idle'; configurePriorInputs(); return; }
  const targets=roundNo===1
    ?[1,2,3,4].map(k=>({key:'final'+k,inputIndex:k-1,label:`파이널 ${k}회`,percentile:score=>finalRoundPercentile(k,score)}))
    :[...Array(roundNo-1)].map((_,index)=>{
      const k=index+1;
      return {key:'last'+k,inputIndex:index,label:`최종 ${k}회`,percentile:score=>percentileForLast(k,score)};
    });
  priorLoadState='loading';
  status.textContent=(roundNo===1?'파이널':'이전 최종 모의고사')+' 최초 응시 기록을 불러오는 중입니다…';
  try{
    const url=AL_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(nm)+'&select=round,score,source,ox,updated_at&order=updated_at.asc';
    const response=await fetch(url,{headers:{apikey:AL_KEY,Authorization:'Bearer '+AL_KEY}});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const rows=await response.json();
    if(requestVersion!==priorLoadVersion||document.getElementById('nm').value.trim()!==nm) return;
    const firstByRound={};
    rows.forEach(row=>{
      const key=String(row.round||'');
      if(!firstByRound[key]&&row.source!=='reset'&&row.ox!=='RESET'&&Number.isFinite(Number(row.score))) firstByRound[key]=row;
    });
    let connected=0;
    targets.forEach(target=>{
      const row=firstByRound[target.key];
      const pct=row&&target.percentile(Number(row.score));
      if(pct==null) return;
      inputs[target.inputIndex].value=pct.toFixed(1);
      inputs[target.inputIndex].dataset.auto='1';
      connected++;
    });
    priorLoadState='loaded';
    invalidateComment();
    status.textContent=connected
      ?`중앙 기록에서 ${targets.length===4?'파이널':'최종 모의고사'} 최초 응시 ${connected}회를 연결했습니다. 재응시 기록은 누적에서 제외합니다.`
      :`연결할 ${targets.length===4?'파이널':'이전 최종 모의고사'} 최초 응시 기록이 없습니다.`;
  }catch(error){
    if(requestVersion!==priorLoadVersion||document.getElementById('nm').value.trim()!==nm) return;
    priorLoadState='error';
    status.textContent='이전 성적을 자동으로 불러오지 못했습니다. 네트워크를 확인한 뒤 [최초 성적 연결]을 다시 눌러 주세요.';
  }
}
/* 어드민에서 학생을 지정해 열면 이름과 중앙의 최초 응시 기록을 자동으로 채운다. */
