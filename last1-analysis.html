<div class="panel">
<div class="adm">🧑‍🏫 재원생 성적 기록 화면입니다. 온라인 회원은 학생 화면에서 직접 입력하고, 재원생은 선생님이 대신 기록할 수 있습니다. 누적에는 입력 주체와 관계없이 회차별 최초 성적만 반영됩니다.</div>

<script>
/* ===== 최종 1회 데이터 ===== */
const TITLE='초등선발 대비 최종 모의고사 1회';
const AVG=32.4;
const TYPES=['특정 숫자가 들어있는 수의 개수','요일','순환소수의 자릿수','가우스 덧셈의 활용','고장난 시계의 시간 차','종이 접기','표에서의 특정 칸을 포함하는 사각형의 개수','원에서 마주보고 있는 수 구하기','합이 일정한 수','두 수의 합을 보고 원래의 수 구하기','도형이 나타내는 수','도형을 이용한 계차수열의 활용','자리 수하기','곱과 합이 일정한 수 구하기','연속으로 이웃하는 칸의 합이 같은 수 구하기','바둑돌 채우기(그림그려 해결하기)','간격의 활용','깃발의 가짓수','서랍원리','주사위 움직이기','상자에 구슬을 서로 다르게 담기','그림그려 해결하기','반복마디의 활용','조건에 맞는 수의 활용','이진법','재치있게 계산하기(덧셈)','논리추리(이중조건)','줄 세우기(활용)','두 종류의 수로 만든 수의 가짓수','복면산'];
const AREA=['수,규칙찾기','식의 계산','수,규칙찾기','수,규칙찾기','식의 계산','도형','도형','수,규칙찾기','수,규칙찾기','식의 계산','수,규칙찾기','수,규칙찾기','수,규칙찾기','수,규칙찾기','수,규칙찾기','식의 계산','식의 계산','경우의 수','경우의 수','도형','경우의 수','식의 계산','수,규칙찾기','수,규칙찾기','수,규칙찾기','식의 계산','경우의 수','경우의 수','수,규칙찾기','식의 계산'];
const RATE=[.323809524,.6,.904761905,.228571429,.238095238,.133333333,.380952381,.352380952,.285714286,.114285714,.714285714,.152380952,.076190476,.514285714,.447619048,.247619048,.428571429,.580952381,.40952381,.485714286,.371428571,.361904762,.428571429,0,.257142857,.133333333,.39047619,.2,.095238095,.180952381];
const PTS=[...Array(12).fill(2.7),...Array(10).fill(3.4),...Array(8).fill(4.2)];
const AREAS=['수,규칙찾기','도형','경우의 수','식의 계산'];
const VALIDATION_LOCK=Object.freeze({
  active:false,
  reasons:Object.freeze([])
});
const ITEM_STATUS=Object.freeze({});

/* 점수 → 상위 백분율 → 예상 결과 */
const TB=[
  [76.7,0.9],[69.8,1.8],[69.5,2.7],[67.8,3.6],[67.7,4.5],[66.3,5.5],
  [60.8,6.4],[60.2,7.3],[58,8.2],[57.9,9.1],[56.9,10.0],[56.1,10.9],
  [56,11.8],[55.7,12.7],[54.2,13.6],[52.7,14.5],[52.6,16.4],[52.5,17.3],
  [51.1,18.2],[49.9,19.1],[49.1,20.0],[48.4,21.8],[47.7,22.7],[46.5,23.6],
  [45.8,24.5],[43.9,26.4],[42.4,27.3],[40.9,28.2],[40.4,29.1],[40.1,30.0],
  [38.9,30.9],[38.2,31.8],[36.3,32.7],[35.5,33.6],[35,35.5],[34.7,36.4],
  [34.3,37.3],[34,38.2],[33.6,39.1],[32.5,40.9],[32.1,41.8],[32,43.6],
  [31.9,44.5],[31.2,45.5],[30.6,46.4],[30.5,48.2],[30.2,50.0],
  [29.4,50.9],[29.3,51.8],[28.6,52.7],[25.9,54.5],[25.2,55.5],
  [25.1,56.4],[24.8,57.3],[24.5,60.0],[24.4,60.9],[24,63.6],
  [23.8,64.5],[23.3,65.5],[23.2,66.4],[22.4,67.3],[21.8,68.2],
  [21.7,70.0],[20.3,70.9],[19.9,71.8],[19.8,73.6],[19.7,75.5],
  [19.1,76.4],[19,79.1],[18.3,80.0],[17.7,80.9],[17.6,81.8],
  [17.2,82.7],[16.9,83.6],[15.7,84.5],[14.9,85.5],[13,86.4],
  [12.9,87.3],[12.2,88.2],[11.5,90.0],[9.6,91.8],[9.5,92.7],
  [8.8,93.6],[2.7,94.5],[0,95.5]
];

/* 누적 백분율 → 예상 레벨 (상한 기준) */
/* 등급 컷 점수 (최종 1회) — 높은 순 */
const CUTS=[['경시 가능',54.2],['경시컷,심화안정권',40.9],['심화컷,실력안정권',35.0],['심화컷,실력가능',32.5],['실력컷,일품안정권',23.2],['일품컷',17.2],['노력요함',0]];
/* 파이널 최초 응시부터 최종 1회까지, 각 회차 석차 백분율의 평균 기준.
   개인 조정으로 보이는 교차값은 등급 경계에서 제외하고 다수 구간의 경계를 사용한다. */
const CUM=[[19.1,'경시 가능'],[36.1,'경시컷,심화안정권'],[46.2,'심화컷,실력안정권'],[53.3,'실력컷,일품안정권'],[60.0,'일품 가능'],[76.4,'일품컷'],[101,'노력요함']];

const R1=n=>Math.round(n*10)/10;
let X={};

const publishBtn=document.getElementById('publishBtn');
publishBtn.disabled=VALIDATION_LOCK.active;
publishBtn.textContent=VALIDATION_LOCK.active?'🔒 학생 성적 공개 잠금':'✅ 재원생 최초 성적 기록';
publishBtn.title=VALIDATION_LOCK.active?VALIDATION_LOCK.reasons.join(' · '):'';
['analysisBtn','analysisPrintBtn','copyBtn','sendBtn'].forEach(id=>{
  const btn=document.getElementById(id);
  if(btn){ btn.disabled=VALIDATION_LOCK.active; btn.title=VALIDATION_LOCK.reasons.join(' · '); }
});

const grid=document.getElementById('grid');
for(let i=1;i<=30;i++){
  const d=document.createElement('div'); d.className='q'; d.dataset.i=i;
  const itemStatus=ITEM_STATUS[i];
  if(itemStatus) d.classList.add('pending');
  d.innerHTML=`<span class="n">${i}</span><span class="r">${itemStatus||(RATE[i-1]*100).toFixed(1)+'%'}</span>`;
  d.onclick=()=>{ X[i]=!X[i]; d.classList.toggle('x',X[i]); };
  grid.appendChild(d);
}
/* ===== 재원생 최초 성적 기록 =====
   mock_results 테이블의 round='last1' 기본 키를 최초 한 번만 생성한다.
   이미 유효한 기록은 덮지 않고, 정확한 reset 행만 조건부 PATCH로 다시 연다. */
async function loadOfficialLast1(nm){
  const url=AL_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(nm)
    +'&round=eq.last1&select=student,round,ox,score,wrong,source,updated_at&limit=1';
  const response=await fetch(url,{headers:{apikey:AL_KEY,Authorization:'Bearer '+AL_KEY}});
  if(!response.ok) throw new Error('조회 HTTP '+response.status);
  const rows=await response.json();
  return rows[0]||null;
}
function isResetOfficial(row){ return !!(row&&row.source==='reset'&&row.ox==='RESET'); }
function isActiveOfficial(row){ return !!(row&&!isResetOfficial(row)); }
async function publish(){
  if(VALIDATION_LOCK.active){
    alert('학생 성적 공개가 잠겨 있습니다.\n\n- '+VALIDATION_LOCK.reasons.join('\n- ')+'\n\n오답 문항 입력만 미리 준비할 수 있습니다.');
    return;
  }
  const nm=document.getElementById('nm').value.trim();
  if(!nm){ alert('먼저 학생 이름을 입력해 주세요.'); return; }
  let score=0, ox='';
  for(let i=1;i<=30;i++){ if(X[i]) ox+='X'; else { ox+='O'; score+=PTS[i-1]; } }
  score=R1(score);
  const wrong=Object.keys(X).filter(k=>X[k]).length;
  try{
    const existing=await loadOfficialLast1(nm);
    if(isActiveOfficial(existing)){
      alert(nm+' 학생의 최종 1회 최초 성적이 이미 기록되어 있습니다.\n\n기존 최초 성적은 덮어쓰지 않았습니다. 정정이 필요한 경우 먼저 해당 기록을 초기화해 주세요.');
      return;
    }
    if(!confirm(nm+' 학생의 최초 성적을 기록할까요?\n\n점수 '+score+'점 · 오답 '+wrong+'개\n\n기록 후에는 일반 저장으로 덮어쓸 수 없습니다.')) return;
    const payload={student:nm,round:'last1',ox:ox,score:score,wrong:wrong,source:'admin',updated_at:new Date().toISOString()};
    let saveUrl=AL_URL+'/rest/v1/mock_results';
    let method='POST', prefer='return=minimal';
    if(isResetOfficial(existing)){
      method='PATCH'; prefer='return=representation';
      saveUrl+='?student=eq.'+encodeURIComponent(nm)+'&round=eq.last1&source=eq.reset&ox=eq.RESET&select=round';
    }
    const r=await fetch(saveUrl,{method:method,
      headers:{apikey:AL_KEY,Authorization:'Bearer '+AL_KEY,'Content-Type':'application/json',
               Prefer:prefer},
      body:JSON.stringify(payload)});
    if(r.status===409){ alert('다른 입력이 먼저 최초 성적으로 기록되었습니다. 기존 기록을 유지했습니다.'); return; }
    if(!r.ok) throw new Error('저장 HTTP '+r.status);
    if(method==='PATCH'){
      const changed=await r.json();
      if(!Array.isArray(changed)||changed.length!==1){ alert('다른 입력이 먼저 최초 성적으로 기록되었습니다. 기존 기록을 유지했습니다.'); return; }
    }
    alert(nm+' 학생의 최초 성적이 기록되었습니다.\n학생 화면 → 로드맵 10월 1주차 → [성적 확인]에서 볼 수 있어요.');

function radarSVG(ag){
  const cx=170,cy=160,R=105, n=ag.length;
  const ang=i=>-Math.PI/2 + i*2*Math.PI/n;
  const P=(i,r)=>[cx+Math.cos(ang(i))*R*r, cy+Math.sin(ang(i))*R*r];
  let g='';
  for(let k=1;k<=7;k++){
    const r=k/7, pts=[...Array(n)].map((_,i)=>P(i,r).join(',')).join(' ');
    g+=`<polygon points="${pts}" fill="none" stroke="#d8d8d8" stroke-width="1"/>`;
  }
  for(let i=0;i<n;i++){ const [x,y]=P(i,1); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d8d8d8"/>`; }
  const pts=ag.map((a,i)=>P(i,Math.min(1,a.perf/70)).join(',')).join(' ');
  g+=`<polygon points="${pts}" fill="rgba(70,120,200,.12)" stroke="#4472c4" stroke-width="2"/>`;
  ag.forEach((a,i)=>{ const [x,y]=P(i,Math.min(1,a.perf/70)); g+=`<circle cx="${x}" cy="${y}" r="3" fill="#4472c4"/>`; });
  ag.forEach((a,i)=>{
    const [x,y]=P(i,1.22);
    g+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" font-weight="700" fill="#333">${a.k}</text>`+
       `<text x="${x}" y="${y+13}" text-anchor="middle" font-size="10" fill="#4472c4" font-weight="700">${a.perf.toFixed(0)}%</text>`;
  });
  for(let k=1;k<=7;k++) g+=`<text x="${cx-4}" y="${cy-R*k/7+3}" text-anchor="end" font-size="8" fill="#999">${(k*10).toFixed(0)}%</text>`;
  return `<div style="font-size:12px;font-weight:800;text-align:center;color:#333;margin-bottom:2px">영역별 수행률</div>
  <svg viewBox="0 0 340 330" width="100%">${g}</svg>`;
}

function finalRoundPercentile(roundNo, score){
  const model=window.GFIELD_MOCK_FINAL;
  const stats=model&&model.rounds&&model.rounds[String(roundNo)]&&model.rounds[String(roundNo)].stats;
  if(!stats||!Array.isArray(stats.dist)||!Number.isFinite(stats.n)||stats.n<=0||!Number.isFinite(score)) return null;
  const higher=stats.dist.filter(v=>v>score).length;
  return R1((higher+1)/stats.n*100);
}
async function loadPriorFinalPercentiles(clearFirst){
  const nm=document.getElementById('nm').value.trim();
  const status=document.getElementById('priorStatus');
  const inputs=[1,2,3,4].map(k=>document.getElementById('f'+k));
  if(clearFirst) inputs.forEach(input=>{ input.value=''; delete input.dataset.auto; });
  if(!nm){ status.textContent='학생 이름을 입력하면 중앙 기록의 파이널 최초 응시 성적을 연결합니다.'; return; }
  status.textContent='파이널 최초 응시 기록을 불러오는 중입니다…';
  try{
    const url=AL_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(nm)+'&select=round,score,source,updated_at';
    const response=await fetch(url,{headers:{apikey:AL_KEY,Authorization:'Bearer '+AL_KEY}});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const rows=await response.json();
    const firstByRound={};
    rows.forEach(row=>{
      const match=/^final([1-4])$/.exec(String(row.round||''));
      if(match&&row.source!=='reset'&&Number.isFinite(Number(row.score))) firstByRound[match[1]]=row;
    });
    let connected=0;
    [1,2,3,4].forEach(k=>{
      const row=firstByRound[k];
      const pct=row&&finalRoundPercentile(k,Number(row.score));
      if(pct==null) return;
      inputs[k-1].value=pct.toFixed(1);
      inputs[k-1].dataset.auto='1';
      connected++;
    });
    status.textContent=connected
      ?'중앙 기록에서 파이널 최초 응시 '+connected+'회를 연결했습니다. 연습 재응시 기록은 누적에서 제외합니다.'
