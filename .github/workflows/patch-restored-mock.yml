name: Patch restored mock UI

on:
  push:
    paths:
      - '.github/workflows/patch-restored-mock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-original-mock-ui
          fetch-depth: 0
      - name: Add HW compatibility without changing diagnostic UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mock.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit('pattern not found: '+label)
              s=s.replace(old,new,1)

          rep('<script src="mock-data.js"></script>\n<script src="mock-rx.js"></script>',
              '<script src="mock-data.js"></script>\n<script src="mock-data-hw.js"></script>\n<script src="mock-rx.js"></script>',
              'load hw')

          rep('const REPO="docssam1/hs-report", FILE="mock-data.js", BRANCH="main";\nconst SUPA_URL="https://fgahqumaldheqettmvqg.supabase.co";\nconst SUPA_KEY="sb_publishable_OsjJG92BLMaZrc2jTClt0g_ecdTtf_I";\nconst D=window.GFIELD_DATA||{students:[]};\nconst M=window.GFIELD_MOCK;\nM.results=M.results||{};\nlet mode=null, me=null, curRound="1";',
              'const P=new URLSearchParams(location.search);\nconst SET=(P.get("set")||"").toLowerCase()==="hw"?"hw":"mid";\nconst SETNAME=SET==="hw"?"활용":"중급";\nconst PREVIEW=P.get("preview")==="1";\nconst REPO="docssam1/hs-report", FILE=SET==="hw"?"mock-data-hw.js":"mock-data.js", BRANCH="main";\nconst SUPA_URL="https://fgahqumaldheqettmvqg.supabase.co";\nconst SUPA_KEY="sb_publishable_OsjJG92BLMaZrc2jTClt0g_ecdTtf_I";\nconst D=window.GFIELD_DATA||{students:[]};\nconst M=SET==="hw"?(window.GFIELD_MOCK_HW||{}):(window.GFIELD_MOCK||{});\nM.results=M.results||{};\nlet mode=null, me=null, curRound="1";\nfunction rkey(r,slot){ return (SET==="hw"?"hw":"")+String(r)+(Number(slot)>1?"@"+slot:""); }\nfunction unkey(raw){ raw=String(raw||""); const hw=raw.startsWith("hw"); if((SET==="hw")!==hw) return null; const b=hw?raw.slice(2):raw; const m=b.match(/^(\\d+)(?:@([123]))?$/); return m?{round:String(+m[1]),slot:+(m[2]||1)}:null; }',
              'constants')

          rep('function roundKeys(){ return Object.keys(M.rounds).sort((a,b)=>+a-+b); }',
              'function roundKeys(){\n  const keys=Object.keys(M.rounds||{}).sort((a,b)=>+a-+b);\n  if(SET!=="hw"||mode==="teacher") return keys;\n  if(!me) return [];\n  const online=((D.studentTypes||{})[me])==="online";\n  if(online&&((((D.archiveAccess||{})["활용 모의고사"])||[]).includes(me))) return keys;\n  if(online||!((D.specialStudents||[]).includes(me))) return [];\n  const tbs=((((D.content||{})["special-summer"])||{}).textbooks)||[], ok=[];\n  tbs.forEach(t=>{ const m=String(t.title||"").match(/활용\\s*모의고사\\s*(\\d+)\\s*회/); if(m&&Array.isArray(t.access)&&t.access.includes(me)) ok.push(String(+m[1])); });\n  return [...new Set(ok)].filter(r=>M.rounds[r]).sort((a,b)=>+a-+b);\n}\nfunction canUseRound(r){ return roundKeys().includes(String(r)); }',
              'round access')

          rep("function lsKey(){ return 'gfield_mock_'+me; }","function lsKey(){ return 'gfield_mock_'+SET+'_'+me; }",'storage split')

          rep('async function supaUpsert(student,r,ox,source){','async function supaUpsert(student,r,ox,source,slot){','upsert signature')
          rep("body:JSON.stringify({student:student,round:r,ox:oxs,score:sc.score,wrong:sc.wrong,source:source||'parent'})",
              "body:JSON.stringify({student:student,round:rkey(r,slot||1),ox:oxs,score:sc.score,wrong:sc.wrong,source:source||'parent'})",
              'upsert key')

          rep("rows.forEach(row=>{ if(!row.ox||row.ox.length!==Q()) return; M.results[row.student]=M.results[row.student]||{}; M.results[row.student][row.round]=[{ox:row.ox.split(''),ts:(row.updated_at||'').slice(0,10),by:row.source||'db'}]; });",
              "rows.forEach(row=>{ const k=unkey(row.round); if(!k||row.source==='reset'||!row.ox||row.ox.length!==Q()) return; M.results[row.student]=M.results[row.student]||{}; M.results[row.student][k.round]=M.results[row.student][k.round]||[]; M.results[row.student][k.round][k.slot-1]={ox:row.ox.split(''),ts:(row.updated_at||'').slice(0,10),by:row.source||'db'}; M.results[row.student][k.round]=M.results[row.student][k.round].filter(Boolean); });",
              'load all')

          rep('function startParent(){ boot(); loadLocal(); renderRoundPick(); }',
              'async function loadStudentServer(){\n  try{\n    const u=SUPA_URL+"/rest/v1/mock_results?select=round,ox,source,updated_at&student=eq."+encodeURIComponent(me);\n    const res=await fetch(u,{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}); if(!res.ok) return;\n    const rows=await res.json(), fresh={};\n    rows.forEach(row=>{ const k=unkey(row.round); if(!k||row.source==="reset"||!row.ox||row.ox.length!==Q()||!M.rounds[k.round]) return; fresh[k.round]=fresh[k.round]||[]; fresh[k.round][k.slot-1]={ox:row.ox.split(""),ts:(row.updated_at||"").slice(0,10),by:row.source||"db"}; });\n    Object.keys(fresh).forEach(r=>fresh[r]=fresh[r].filter(Boolean)); M.results[me]=fresh; saveLocal();\n  }catch(e){}\n}\nasync function startParent(){ boot(); loadLocal(); await loadStudentServer(); renderRoundPick(); }',
              'student load')

          rep('function openMark(r){\n  curRound=r;',
              'function openMark(r){\n  if(!canUseRound(r)){ toast("이 회차는 아직 승인되지 않았어요."); renderRoundPick(); return; }\n  curRound=r;',
              'open guard')
          s=s.replace('if(window._pendingRound && M.rounds[window._pendingRound]){ openMark(window._pendingRound);','if(window._pendingRound && M.rounds[window._pendingRound] && canUseRound(window._pendingRound)){ openMark(window._pendingRound);',1)
          s=s.replace('if(rd && M.rounds[rd]) openMark(rd);','if(rd && M.rounds[rd] && canUseRound(rd)) openMark(rd);',1)

          rep('function boot(){\n  document.getElementById(\'gate\').classList.add(\'hidden\');',
              'function boot(){\n  const gh=document.querySelector(\'#gate h2\'); if(gh) gh.textContent=SETNAME+" 모의고사 진단";\n  const hh=document.querySelector(\'header .t\'); if(hh) hh.firstChild.nodeValue=SETNAME+" 모의고사 진단";\n  document.title="지필드 영재교육 | "+SETNAME+" 모의고사 진단";\n  document.getElementById(\'gate\').classList.add(\'hidden\');',
              'dynamic title')
          s=s.replace('<b>중급 모의고사</b>','<b>${SETNAME} 모의고사</b>',1)
          s=s.replace('<h2>중급 모의고사 '+"'+ti+'"+' 정답</h2>','<h2>'+"'+SETNAME+'"+' 모의고사 '+"'+ti+'"+' 정답</h2>',1)

          old="""  const at=attemptsOf(me,curRound);
  if(at.length>=3){ if(!confirm('이미 3회 응시했어요. 가장 오래된 기록을 지우고 새로 저장할까요?')) return; }
  const prev = at.length? at[at.length-1].ox.slice() : null;
  pushAttempt(me,curRound,markOx,'parent'); saveLocal();
  const ok=await supaUpsert(me,curRound,markOx,'parent');"""
          new="""  const at=attemptsOf(me,curRound);
  if(PREVIEW){ toast('관리자 미리보기에서는 저장되지 않습니다.'); return; }
  if(at.length>=3){ toast('이 회차의 3회 응시 기록을 모두 사용했어요.'); return; }
  const prev = at.length? at[at.length-1].ox.slice() : null;
  const slot=at.length+1;
  pushAttempt(me,curRound,markOx,'parent'); saveLocal();
  const ok=await supaUpsert(me,curRound,markOx,'parent',slot);"""
          rep(old,new,'attempt slots')

          # 활용 데이터 저장 시 올바른 파일/전역명 사용
          s=s.replace('window.GFIELD_MOCK = "+JSON.stringify(out,null,2)+";\\n";', 'window."+(SET==="hw"?"GFIELD_MOCK_HW":"GFIELD_MOCK")+" = "+JSON.stringify(out,null,2)+";\\n";',1)
          s=s.replace("message:'Update mock-data.js (types/answers)'","message:'Update '+FILE+' (types/answers)'",1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate restored behavior
        run: |
          grep -q '단계별 분석' mock.html
          grep -q '약점 유형별 처방 교재' mock.html
          grep -q 'mock-data-hw.js' mock.html
          grep -q 'gfield_mock_.*SET' mock.html
      - name: Commit compatibility patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mock.html
          git commit -m '기존 상세 진단 UI에 활용 권한과 기록 분리만 적용'
          git push origin HEAD:agent/restore-original-mock-ui
