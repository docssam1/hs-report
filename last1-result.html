<style>*{box-sizing:border-box;margin:0;padding:0}

</style></head><body><div class="wrap">

</div></div>
<script>
const SB_URL="https://fgahqumaldheqettmvqg.supabase.co";
const SB_KEY="sb_publishable_OsjJG92BLMaZrc2jTClt0g_ecdTtf_I";
const ROUND="last1";
const AVG=28.1;
const TB=[[76.7,0.8,'경시 가능'],[69.8,1.7,'경시 가능'],[69.5,2.5,'경시 가능'],[67.8,3.3,'경시 가능'],[67.7,4.2,'경시 가능'],[66.3,5.0,'경시 가능'],[60.8,5.8,'경시 가능'],[60.2,6.7,'경시 가능'],[58,7.5,'경시 가능'],[57.9,8.3,'경시 가능'],[56.9,9.2,'경시 가능'],[56.1,10.0,'경시 가능'],[56,10.8,'경시 가능'],[55.7,11.7,'경시 가능'],[54.2,12.5,'경시 가능'],[52.7,13.3,'경시컷,심화안정권'],[52.6,15.0,'경시컷,심화안정권'],[52.5,15.8,'경시컷,심화안정권'],[51.1,16.7,'경시컷,심화안정권'],[49.9,17.5,'경시컷,심화안정권'],[49.1,18.3,'경시컷,심화안정권'],[48.4,20.0,'경시컷,심화안정권'],[47.7,20.8,'경시컷,심화안정권'],[46.5,21.7,'경시컷,심화안정권'],[45.8,22.5,'경시컷,심화안정권'],[43.9,24.2,'경시컷,심화안정권'],[42.4,25.0,'경시컷,심화안정권'],[40.9,25.8,'경시컷,심화안정권'],[40.4,26.7,'심화컷,실력안정권'],[40.1,27.5,'심화컷,실력안정권'],[38.9,28.3,'심화컷,실력안정권'],[38.2,29.2,'심화컷,실력안정권'],[36.3,30.0,'심화컷,실력안정권'],[35.5,30.8,'심화컷,실력안정권'],[35,32.5,'심화컷,실력안정권'],[34.7,33.3,'심화컷,실력가능'],[34.3,34.2,'심화컷,실력가능'],[34,35.0,'심화컷,실력가능'],[33.6,35.8,'심화컷,실력가능'],[32.5,37.5,'심화컷,실력가능'],[32.1,38.3,'실력컷,일품안정권'],[32,40.0,'실력컷,일품안정권'],[31.9,40.8,'실력컷,일품안정권'],[31.2,41.7,'실력컷,일품안정권'],[30.6,42.5,'실력컷,일품안정권'],[30.5,44.2,'실력컷,일품안정권'],[30.2,45.8,'실력컷,일품안정권'],[29.4,46.7,'실력컷,일품안정권'],[29.3,47.5,'실력컷,일품안정권'],[28.6,48.3,'실력컷,일품안정권'],[25.9,50.0,'실력컷,일품안정권'],[25.2,50.8,'실력컷,일품안정권'],[25.1,51.7,'실력컷,일품안정권'],[24.8,52.5,'실력컷,일품안정권'],[24.5,55.0,'실력컷,일품안정권'],[24.4,55.8,'실력컷,일품안정권'],[24,58.3,'실력컷,일품안정권'],[23.8,59.2,'실력컷,일품안정권'],[23.3,60.0,'실력컷,일품안정권'],[23.2,60.8,'실력컷,일품안정권'],[22.4,61.7,'일품컷'],[21.8,62.5,'일품컷'],[21.7,64.2,'일품컷'],[20.3,65.0,'일품컷'],[19.9,65.8,'일품컷'],[19.8,67.5,'일품컷'],[19.7,69.2,'일품컷'],[19.1,70.0,'일품컷'],[19,72.5,'일품컷'],[18.3,73.3,'일품컷'],[17.7,74.2,'일품컷'],[17.6,75.0,'일품컷'],[17.2,75.8,'일품컷'],[16.9,76.7,'노력요함'],[15.7,77.5,'노력요함'],[14.9,78.3,'노력요함'],[13,79.2,'노력요함'],[12.9,80.0,'노력요함'],[12.2,80.8,'노력요함'],[11.5,82.5,'노력요함'],[9.6,84.2,'노력요함'],[9.5,85.0,'노력요함'],[8.8,85.8,'노력요함'],[2.7,86.7,'노력요함'],[0,87.5,'노력요함']];

function round1(x){return Math.round(x*10)/10}
/* 점수 → 상위 백분율 · 예상 결과 (표에서 그 점수 이하의 첫 구간) */
function lookup(score){
  for(let i=0;i<TB.length;i++){ if(score>=TB[i][0]) return {pct:TB[i][1], gd:TB[i][2]}; }
  return {pct:TB[TB.length-1][1], gd:TB[TB.length-1][2]};
}
const COLOR={'경시 가능':'#7f1d1d','경시컷,심화안정권':'#b91c1c','심화컷,실력안정권':'#c2410c',
  '심화컷,실력가능':'#d97706','실력컷,일품안정권':'#0d9488','일품컷':'#2563eb','노력요함':'#64748b'};

function qs(k){ return new URLSearchParams(location.search).get(k)||''; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(id){document.getElementById(id).classList.remove('hide')}
function hide(id){document.getElementById(id).classList.add('hide')}

async function load(){
  const nm=(document.getElementById('nm').value||qs('name')).trim();
  if(!nm){ document.getElementById('err').textContent='이름을 입력해 주세요.'; show('err'); return; }
  hide('err'); hide('ask'); hide('res'); show('loading');
  let rows=null;
  try{
    const u=SB_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(nm)
      +'&round=eq.'+ROUND+'&select=student,round,score,wrong,ox,updated_at';
    const r=await fetch(u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    rows=await r.json();
  }catch(e){
    hide('loading'); show('ask');
    document.getElementById('nm').value=nm;
    document.getElementById('err').textContent='성적을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    show('err'); return;
  }
  hide('loading');
  render(nm, (rows&&rows.length)?rows[rows.length-1]:null);
}

function render(nm,row){
  const box=document.getElementById('res');
  if(!row || row.score==null || row.ox==='RESET'){
    box.innerHTML='<div class="who">'+esc(nm)+' 학생</div>'+
      '<div class="none"><span class="e">📮</span>아직 <b>최종 모의고사 1회</b> 성적이 등록되지 않았어요.<br>'+
      '채점이 끝나면 이 화면에서 바로 확인할 수 있어요.</div>'+
      '<div class="msg">이름이 정확한지 한 번 확인해 주세요. 계속 안 보이면 선생님께 말해 주세요.</div>';
    show('res'); return;
  }
  const sc=Number(row.score), L=lookup(sc), dv=round1(sc-AVG), col=COLOR[L.gd]||'#1f3864';
  const ok=(row.ox&&row.ox.length)?(row.ox.split('').filter(c=>c==='O'||c==='1').length):null;
  box.innerHTML=
    '<div class="who">'+esc(nm)+' 학생 · <b>최종 모의고사 1회</b></div>'+
    '<div class="big"><span class="n">'+round1(sc)+'</span><span class="u">점</span>'+
      '<div class="t">100점 만점</div></div>'+
    '<div class="rowz">'+
      '<div class="box"><div class="k">상위 백분율</div><div class="v">'+L.pct+'%</div></div>'+
      '<div class="box"><div class="k">평균 대비</div><div class="v" style="color:'+(dv>=0?'#0d9488':'#c0392b')+'">'+(dv>=0?'+':'')+dv+'</div></div>'+
      (ok!=null?'<div class="box"><div class="k">맞은 문항</div><div class="v">'+ok+'<span style="font-size:12px;color:#8a94a6">/30</span></div></div>':'')+
    '</div>'+
    '<div class="grade" style="background:'+col+'"><div class="k">예상 결과</div><div class="v">'+esc(L.gd)+'</div></div>'+
    '<div class="msg">'+cheer(L.gd,dv)+'</div>';
  show('res');
}

function cheer(gd,dv){
  if(gd==='경시 가능') return '최상위권이야. 지금 흐름을 그대로 시험날까지 끌고 가면 돼. 틀린 문제는 꼭 다시 풀어보자!';
  if(gd.indexOf('경시컷')===0) return '아주 잘하고 있어. 여기서 한 문제만 더 맞히면 최상위권이야. 실수로 놓친 문제부터 다시 보자.';
  if(gd.indexOf('심화컷')===0) return '기본기는 탄탄해. 어려운 문제에서 한 발짝만 더 나아가면 돼. 조건 정리하는 연습을 해보자!';
  if(gd.indexOf('실력컷')===0) return '차근차근 오르고 있어. 맞힐 수 있었는데 놓친 문제부터 챙기면 점수가 확 올라가.';
  if(gd==='일품컷') return '아직 시간 충분해. 정답률 높은 문제부터 확실하게 잡아 나가자. 한 문제씩이면 충분해!';
  return dv>=0?'평균보다 잘했어! 여기서 조금씩만 더 쌓아가자.':'괜찮아, 지금부터가 진짜야. 쉬운 문제부터 하나씩 확실하게 만들어 가자!';
}

(function(){
  const n=qs('name').trim();
  if(n){ document.getElementById('nm').value=n; load(); }
  else { hide('loading'); show('ask'); }
})();
</script></body></html>
