<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최종 모의고사 성적 확인 | 지필드 영재교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#eef1f6;color:#1f2430;line-height:1.6;padding:24px 14px}
.wrap{max-width:520px;margin:0 auto}
.card{background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(30,60,114,.10);overflow:hidden}
.hd{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;padding:20px 22px}
.hd .b{font-size:11.5px;opacity:.85;letter-spacing:.4px}
.hd h1{font-size:19px;font-weight:800;margin-top:4px}
.bd{padding:22px}
.ask label{display:block;font-size:12.5px;font-weight:800;color:#5b6474;margin-bottom:7px}
.ask input{width:100%;padding:12px 14px;border:1.5px solid #e3e8ef;border-radius:11px;font-size:15px;font-family:inherit;outline:none}
.ask input:focus{border-color:#2a5298}
button{border:none;border-radius:11px;padding:12px 20px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#2a5298,#1e3c72);color:#fff;width:100%;margin-top:10px}
.who{font-size:13px;color:#5b6474;margin-bottom:14px}
.who b{color:#1f3864;font-size:15px}
.origin{margin:-7px 0 12px;color:#7b8798;font-size:10.8px;text-align:center}
.big{text-align:center;padding:18px 0 6px}
.big .n{font-size:52px;font-weight:800;color:#1f3864;line-height:1}
.big .u{font-size:15px;font-weight:800;color:#8a94a6;margin-left:3px}
.big .t{font-size:12px;color:#8a94a6;margin-top:5px}
.rowz{display:flex;gap:10px;margin-top:16px}
.box{flex:1;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:13px;padding:13px 10px;text-align:center}
.box .k{font-size:11px;font-weight:700;color:#8a94a6}
.box .v{font-size:20px;font-weight:800;color:#1f3864;margin-top:3px}
.grade{margin-top:16px;border-radius:14px;padding:16px;text-align:center;color:#fff;font-weight:800}
.grade .k{font-size:11.5px;opacity:.9}
.grade .v{font-size:22px;margin-top:3px}
.cum-card{margin-top:12px;border:1px solid #dbe4f0;border-radius:14px;padding:14px;background:#f8fafc}
.cum-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:#64748b;font-weight:800}
.cum-head b{font-size:18px;color:#1f3864}
.cum-grade{margin-top:7px;font-size:14px;font-weight:900;color:#1f3864}
.cum-trend{margin-top:8px;font-size:11px;line-height:1.7;color:#64748b;word-break:keep-all}
.data-proof{margin-top:11px;padding:11px 13px;border-radius:11px;background:#f3f6fb;color:#526075;font-size:11.8px;line-height:1.65;text-align:center}
.msg{margin-top:16px;background:#fff7ec;border:1px solid #f0ddc4;border-radius:12px;padding:14px;font-size:12.8px;color:#8a5a20;line-height:1.7}
.none{text-align:center;padding:26px 10px;color:#8a94a6;font-size:13.5px;line-height:1.8}
.none .e{font-size:40px;display:block;margin-bottom:8px}
.ft{padding:13px 22px;background:#fafbfd;border-top:1px solid #eef1f6;font-size:11px;color:#a0a8b3;text-align:center}
.err{background:#fef2f2;border:1px solid #fbcaca;color:#c0392b;border-radius:11px;padding:12px;font-size:12.5px;margin-top:12px}
.hide{display:none}
</style></head><body><div class="wrap">
<div class="card">
  <div class="hd"><div class="b">대치 지필드 영재교육 · LETE-ON 성적 분석</div>
  <h1 id="pageTitle">최종 모의고사 성적 확인</h1></div>
  <div class="bd">
    <div id="ask" class="ask hide">
      <label>이름을 입력하세요</label>
      <input id="nm" placeholder="예: 김규빈" autocomplete="off">
      <button onclick="load()">내 성적 확인하기</button>
      <div id="err" class="err hide"></div>
    </div>
    <div id="loading" class="none"><span class="e">⏳</span>성적을 불러오는 중이에요…</div>
    <div id="res" class="hide"></div>
  </div>
  <div class="ft">© 지필드 영재교육 · 회차별 최초 성적을 기준으로 표시합니다.</div>
</div></div>
<script src="mock-data-final.js"></script>
<script src="mock-data-last.js?v=20260823c"></script>
<script src="mock-data-last3.js?v=20260823c"></script>
<script src="mock-data-last4.js?v=20260823c"></script>
<script src="last-score-data.js?v=20260823c"></script>
<script>
const SB_URL="https://fgahqumaldheqettmvqg.supabase.co";
const SB_KEY="sb_publishable_OsjJG92BLMaZrc2jTClt0g_ecdTtf_I";
const params=new URLSearchParams(location.search);
const rawRound=params.get('round');
const roundNo=rawRound==null||rawRound===''?1:(/^[1-4]$/.test(rawRound)?Number(rawRound):0);
const SCORE_MODEL=window.GFIELD_LAST_SCORE_DATA||{rounds:{}};
const ROUND_DATA=SCORE_MODEL.rounds[String(roundNo)];
const PAPER_ROUND=window.GFIELD_MOCK_LAST&&window.GFIELD_MOCK_LAST.rounds&&window.GFIELD_MOCK_LAST.rounds[String(roundNo)];
const ROUND_OPEN=!!(PAPER_ROUND&&PAPER_ROUND.ready===true);
const ROUND=ROUND_DATA&&ROUND_DATA.key||('last'+roundNo);
const AVG=ROUND_DATA&&ROUND_DATA.average||0;
const CUTS=ROUND_DATA&&ROUND_DATA.scoreBands||[];
const CUM=ROUND_DATA&&ROUND_DATA.cumulativeBands||[];
const DATA_READY=!!(roundNo&&ROUND_DATA&&Array.isArray(ROUND_DATA.items)&&ROUND_DATA.items.length===30&&
  Array.isArray(ROUND_DATA.rates)&&ROUND_DATA.rates.length===30&&Array.isArray(CUTS)&&CUTS.length&&Array.isArray(CUM)&&CUM.length);

function round1(x){return Math.round(x*10)/10}
function percentileForLast(rNo,score){
  const data=SCORE_MODEL.rounds&&SCORE_MODEL.rounds[String(rNo)];
  if(!data||!Number.isFinite(score)) return null;
  if(Array.isArray(data.percentileTable)){
    for(let i=0;i<data.percentileTable.length;i++) if(score>=data.percentileTable[i][0]) return data.percentileTable[i][1];
    return data.percentileTable.length?data.percentileTable[data.percentileTable.length-1][1]:null;
  }
  if(!Array.isArray(data.scoreDist)||!Number.isFinite(data.cohortSize)||data.cohortSize<=0) return null;
  const higher=data.scoreDist.filter(v=>v>score).length;
  return round1((higher+1)/data.cohortSize*100);
}
/* 점수 → 상위 백분율 · 예상 결과 (표에서 그 점수 이하의 첫 구간) */
function gradeForScore(score){
  for(let i=0;i<CUTS.length;i++){ if(score>=CUTS[i][1]) return CUTS[i][0]; }
  return '노력요함';
}
function lookup(score){
  const pct=percentileForLast(roundNo,score);
  return {pct:pct==null?100:pct, gd:gradeForScore(score)};
}
const COLOR={'경시 가능':'#7f1d1d','경시컷,심화안정권':'#b91c1c','심화컷,실력안정권':'#c2410c',
  '심화컷,실력가능':'#d97706','실력컷,일품안정권':'#0d9488','일품 가능':'#0d9488','일품컷':'#2563eb','노력요함':'#64748b'};

function finalRoundPercentile(roundNo,score){
  const model=window.GFIELD_MOCK_FINAL;
  const stats=model&&model.rounds&&model.rounds[String(roundNo)]&&model.rounds[String(roundNo)].stats;
  if(!stats||!Array.isArray(stats.dist)||!Number.isFinite(stats.n)||stats.n<=0||!Number.isFinite(score)) return null;
  const higher=stats.dist.filter(v=>v>score).length;
  return round1((higher+1)/stats.n*100);
}
function cumulativeGrade(avgPct){
  for(let i=0;i<CUM.length;i++){ if(avgPct<=CUM[i][0]) return CUM[i][1]; }
  return '노력요함';
}
function cumulativeInfo(rows,currentPct){
  const entries=[];
  if(roundNo===1){
    [1,2,3,4].forEach(finalNo=>{
      const row=(rows||[]).filter(r=>r.round==='final'+finalNo&&r.source!=='reset').shift();
      const pct=row&&finalRoundPercentile(finalNo,Number(row.score));
      if(pct!=null) entries.push({label:'파이널 '+finalNo+'회',pct:pct});
    });
    entries.push({label:'최종 1회',pct:currentPct});
  }else{
    for(let lastNo=1;lastNo<=roundNo;lastNo++){
      const key='last'+lastNo;
      const row=(rows||[]).filter(r=>r.round===key&&r.source!=='reset').shift();
      const pct=lastNo===roundNo?currentPct:(row&&percentileForLast(lastNo,Number(row.score)));
      if(pct!=null) entries.push({label:'최종 '+lastNo+'회',pct:pct});
    }
  }
  const avg=round1(entries.reduce((sum,item)=>sum+item.pct,0)/entries.length);
  return {entries:entries,avg:avg,grade:cumulativeGrade(avg)};
}

function qs(k){ return new URLSearchParams(location.search).get(k)||''; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(id){document.getElementById(id).classList.remove('hide')}
function hide(id){document.getElementById(id).classList.add('hide')}
function sourceLabel(source){
  if(source==='online') return '온라인 회원이 직접 입력한 최초 성적';
  if(source==='admin'||source==='teacher') return '선생님이 기록한 최초 성적';
  return '학생·학부모가 입력한 최초 성적';
}

async function load(){
  if(!ROUND_OPEN){
    hide('loading'); show('ask');
    document.getElementById('err').textContent='최종 '+roundNo+'회는 현재 검수 대기 중입니다. 시험 공개 후 성적을 확인할 수 있습니다.';
    show('err'); return;
  }
  if(!DATA_READY){
    hide('loading'); show('ask');
    document.getElementById('err').textContent='회차별 성적 기준을 불러오지 못했습니다. 주소의 회차를 확인한 뒤 새로고침해 주세요.';
    show('err'); return;
  }
  const nm=(document.getElementById('nm').value||qs('name')).trim();
  if(!nm){ document.getElementById('err').textContent='이름을 입력해 주세요.'; show('err'); return; }
  hide('err'); hide('ask'); hide('res'); show('loading');
  let rows=null;
  try{
    const u=SB_URL+'/rest/v1/mock_results?student=eq.'+encodeURIComponent(nm)
      +'&select=student,round,score,wrong,ox,source,updated_at&order=updated_at.asc';
    const r=await fetch(u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    rows=await r.json();
  }catch(e){
    hide('loading'); show('ask');
    document.getElementById('nm').value=nm;
    document.getElementById('err').textContent='성적을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    show('err'); return;
  }
  hide('loading');
  const current=(rows||[]).filter(row=>row.round===ROUND&&row.source!=='reset').shift()||
    (rows||[]).filter(row=>row.round===ROUND).shift()||null;
  render(nm,current,rows||[]);
}

function render(nm,row,rows){
  const box=document.getElementById('res');
  if(!row || row.score==null || row.ox==='RESET'){
    box.innerHTML='<div class="who">'+esc(nm)+' 학생</div>'+
      '<div class="none"><span class="e">📮</span>아직 <b>최종 모의고사 '+roundNo+'회</b> 성적이 등록되지 않았어요.<br>'+
      '채점이 끝나면 이 화면에서 바로 확인할 수 있어요.</div>'+
      '<div class="msg">이름이 정확한지 한 번 확인해 주세요. 계속 안 보이면 선생님께 말해 주세요.</div>';
    show('res'); return;
  }
  const sc=Number(row.score), L=lookup(sc), dv=round1(sc-AVG), col=COLOR[L.gd]||'#1f3864';
  const cumulative=cumulativeInfo(rows,L.pct);
  const cumulativeColor=COLOR[cumulative.grade]||'#1f3864';
  const cumulativeHTML='<div class="cum-card"><div class="cum-head"><span>통합 석차 백분율 · 최초 성적 '+cumulative.entries.length+'회</span><b>'+cumulative.avg+'%</b></div>'+
    '<div class="cum-grade" style="color:'+cumulativeColor+'">누적 판정 · '+esc(cumulative.grade)+'</div>'+
    '<div class="cum-trend">'+cumulative.entries.map(item=>esc(item.label)+' '+item.pct+'%').join(' · ')+'<br>각 회차의 상위 백분율을 평균했으며 연습 재응시는 제외했습니다.</div></div>';
  const ok=(row.ox&&row.ox.length)?(row.ox.split('').filter(c=>c==='O'||c==='1').length):null;
  box.innerHTML=
    '<div class="who">'+esc(nm)+' 학생 · <b>최종 모의고사 '+roundNo+'회</b></div>'+
    '<div class="origin">'+esc(sourceLabel(row.source))+'</div>'+
    '<div class="big"><span class="n">'+round1(sc)+'</span><span class="u">점</span>'+
      '<div class="t">100점 만점</div></div>'+
    '<div class="rowz">'+
      '<div class="box"><div class="k">상위 백분율</div><div class="v">'+L.pct+'%</div></div>'+
      '<div class="box"><div class="k">평균 대비</div><div class="v" style="color:'+(dv>=0?'#0d9488':'#c0392b')+'">'+(dv>=0?'+':'')+dv+'</div></div>'+
      (ok!=null?'<div class="box"><div class="k">맞은 문항</div><div class="v">'+ok+'<span style="font-size:12px;color:#8a94a6">/30</span></div></div>':'')+
    '</div>'+
    '<div class="grade" style="background:'+col+'"><div class="k">예상 결과</div><div class="v">'+esc(L.gd)+'</div></div>'+
    cumulativeHTML+
    '<div class="data-proof">상위 백분율과 예상 결과는 <b>'+esc(SCORE_MODEL.dataProof||'누적 성적 데이터')+'</b>입니다.</div>'+
    '<div class="msg">'+cheer(L.gd,dv)+'</div>';
  show('res');
}

function cheer(gd,dv){
  if(gd==='경시 가능') return '최상위권이야. 지금 흐름을 그대로 시험날까지 끌고 가면 돼. 틀린 문제는 꼭 다시 풀어보자!';
  if(gd.indexOf('경시컷')===0) return '아주 잘하고 있어. 여기서 한 문제만 더 맞히면 최상위권이야. 실수로 놓친 문제부터 다시 보자.';
  if(gd.indexOf('심화컷')===0) return '기본기는 탄탄해. 어려운 문제에서 한 발짝만 더 나아가면 돼. 조건 정리하는 연습을 해보자!';
  if(gd.indexOf('실력컷')===0) return '차근차근 오르고 있어. 맞힐 수 있었는데 놓친 문제부터 챙기면 점수가 확 올라가.';
  if(gd==='일품 가능') return '기본 문항부터 정확히 마무리하면 충분히 올라갈 수 있어. 오늘 놓친 조건을 다시 표시해 보자!';
  if(gd==='일품컷') return '아직 시간 충분해. 정답률 높은 문제부터 확실하게 잡아 나가자. 한 문제씩이면 충분해!';
  return dv>=0?'평균보다 잘했어! 여기서 조금씩만 더 쌓아가자.':'괜찮아, 지금부터가 진짜야. 쉬운 문제부터 하나씩 확실하게 만들어 가자!';
}

(function(){
  if(!ROUND_OPEN){
    hide('loading'); show('ask');
    document.getElementById('err').textContent=roundNo?'최종 '+roundNo+'회는 현재 검수 대기 중입니다. 시험 공개 후 성적을 확인할 수 있습니다.':'주소의 회차가 올바르지 않습니다. 최종 모의고사 1~4회 중 하나를 선택해 주세요.';
    show('err'); return;
  }
  if(!DATA_READY){
    hide('loading'); show('ask');
    document.getElementById('err').textContent=roundNo?'성적 기준을 완전하게 불러오지 못했습니다. 잠시 후 새로고침해 주세요.':'주소의 회차가 올바르지 않습니다. 최종 모의고사 1~4회 중 하나를 선택해 주세요.';
    show('err'); return;
  }
  document.title='최종 모의고사 '+roundNo+'회 성적 확인 | 지필드 영재교육';
  document.getElementById('pageTitle').textContent='최종 모의고사 '+roundNo+'회 성적 확인';
  const n=qs('name').trim();
  if(n){ document.getElementById('nm').value=n; load(); }
  else { hide('loading'); show('ask'); }
})();
</script></body></html>
