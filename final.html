<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>파이널 모의고사 진단 · 지필드 영재교육</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F3864;--navy2:#2a5298;--orange:#f97316;--orange-d:#ea580c;--ink:#2d2a26;--ink2:#5b5148;--dim:#9a8f83;--bg:#f7f5f2;--line:#e8ded1;--soft:#fff7ed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}
.doc{max-width:900px;margin:0 auto;background:#fff;box-shadow:0 2px 30px rgba(0,0,0,.07)}
.cover{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:44px 46px 38px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-70px;top:-70px;width:250px;height:250px;border-radius:50%;background:rgba(249,115,22,.18)}
.cover .brand{font-size:11px;letter-spacing:.34em;color:#ffd9b8;font-weight:700}
.cover h1{font-family:'Jua';font-size:31px;margin:12px 0 4px;font-weight:400;position:relative;z-index:1}
.cover .sub{color:#c7d6ef;font-size:14px}
.cover .who{margin-top:26px;display:flex;align-items:flex-end;gap:14px;position:relative;z-index:1}
.cover .who b{font-family:'Jua';font-size:34px}
.cover .who span{color:#c7d6ef;font-size:13px;padding-bottom:7px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.22);margin-top:26px;border-radius:12px;overflow:hidden;position:relative;z-index:1}
.kpi div{background:rgba(255,255,255,.1);padding:14px 12px;text-align:center}
.kpi i{display:block;font-style:normal;font-size:11px;color:#c7d6ef;margin-bottom:3px}
.kpi b{font-family:'Jua';font-size:21px;font-weight:400}
.kpi b small{font-size:12px;color:#c7d6ef;font-family:'Noto Sans KR'}
section{padding:34px 46px;border-bottom:1px solid var(--line)}
h2{font-family:'Jua';font-size:19px;color:var(--navy);font-weight:400;margin-bottom:4px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:5px;height:18px;background:linear-gradient(var(--orange),var(--orange-d));border-radius:3px}
.lead{font-size:13px;color:var(--dim);margin-bottom:16px;padding-left:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;font-weight:500;padding:9px 8px;font-size:12px}
td{padding:8px;border-bottom:1px solid var(--line)}
td.c{text-align:center} td.dim{color:var(--dim)} .mono{font-family:ui-monospace,monospace;font-size:12px}
tr.r-ok{background:#f6fbf6} tr.r-miss{background:#fff6ed}
.ty b{display:block;font-weight:700;font-size:13px} .ty i{font-style:normal;font-size:11px;color:var(--dim)}
.bar{display:flex;align-items:center;gap:7px}
.bar i{height:7px;background:#cbd5e1;border-radius:4px;min-width:2px}
.bar i.g{background:linear-gradient(90deg,var(--orange),var(--orange-d))}
.bar b{font-size:11px;color:var(--ink2);font-weight:500;width:30px}
.t-ok{color:#16a34a;font-size:11px;font-weight:700}
.t-miss{color:var(--orange-d);font-size:11px;font-weight:700}
.t-hard{color:var(--dim);font-size:11px}
.split{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:center}
@media(max-width:700px){.split{grid-template-columns:1fr}}
.radar{width:100%;max-width:320px;margin:0 auto;display:block}
.radar .plate{fill:#fcfaf7;stroke:#efe7db;stroke-width:1}
.radar .ring{fill:none;stroke:#e9e3da;stroke-width:1}
.radar .grid line{stroke:#e9e3da;stroke-width:1}
.radar .av{fill:url(#gAv);stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 3}
.radar .me{fill:url(#gMe);stroke:none}
.radar .me-line{fill:none;stroke:#ea580c;stroke-width:2.6;stroke-linejoin:round}
.radar .d-me{fill:#fff;stroke:#ea580c;stroke-width:2.4}
.radar .d-av{fill:#94a3b8;opacity:.85}
.radar .sc{font-size:9px;fill:#c3b8aa}
.radar .lb text{font-size:11.5px;fill:var(--navy);font-weight:700}
.radar .lb .pv{font-size:11px;fill:var(--orange-d);font-weight:700}
.radar{max-width:340px;filter:drop-shadow(0 6px 16px rgba(31,56,100,.08))}
.legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--ink2);margin-top:6px}
.legend s{display:inline-block;width:13px;height:9px;border-radius:2px;text-decoration:none;margin-right:5px;vertical-align:-1px}
.cut-warn{background:var(--soft);border:1.5px solid #fdba74;border-radius:11px;padding:13px 17px;font-size:13.5px;color:#7c2d12;margin-top:14px}
.cmp-band{padding:14px 46px 0}
.cmp-band .cmp-note{margin-bottom:0}
.cause{border-radius:15px;padding:20px 22px;margin-bottom:14px;border:1.5px solid}
.c-조건{background:linear-gradient(135deg,#fff7ed,#fff);border-color:#fdba74}
.c-절차{background:linear-gradient(135deg,#eff6ff,#fff);border-color:#bfdbfe}
.c-개념{background:linear-gradient(135deg,#f8fafc,#fff);border-color:#e2e8f0}
.cause-hd{font-family:'Jua';font-size:16px;color:var(--navy);margin-bottom:3px}
.cause-hd b{font-family:'Noto Sans KR';font-size:12.5px;color:var(--orange-d);margin-left:7px}
.cause-desc{font-size:12.5px;color:var(--ink2);margin-bottom:13px}
.cause ol{list-style:none}
.cause li{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:8px}
.cause .no{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:7px}
.cause li b{font-size:13.5px} .cause li em{font-style:normal;font-size:11.5px;color:var(--dim);margin-left:7px}
.able{display:inline-block;background:#fee2b3;color:#7c2d12;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:6px}
.cau-p{font-size:12.5px;color:var(--ink2);margin:7px 0 6px;line-height:1.68}
.cau-p s{display:inline-block;text-decoration:none;background:var(--navy);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.cause-sum{background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;font-size:13.5px;margin-bottom:16px}
.cause-sum b{color:#ffd9b8}
.able-box{background:var(--soft);border:1.5px solid #fdba74;border-radius:12px;padding:14px 18px;font-size:13px;color:#7c2d12}
tr.cau td{border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink2);padding:0 8px 9px;line-height:1.6}
.tg{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff}
.tg-조건{background:var(--orange-d)} .tg-절차{background:#3b82f6} .tg-개념{background:#94a3b8}
.cause li a,td a{color:var(--orange-d);font-size:12px;text-decoration:none;font-weight:700}
.cmt{background:#fbfaf8;border-left:4px solid var(--navy);border-radius:0 13px 13px 0;padding:20px 24px;font-size:14px;color:var(--ink2)}
.cmt p+p{margin-top:11px} .cmt b{color:var(--ink)}
.sign{text-align:right;font-size:12.5px;color:var(--dim);margin-top:16px}
.sign b{font-family:'Jua';color:var(--navy);font-size:15px}
@media print{body{background:#fff}.doc{box-shadow:none}section{break-inside:avoid}.cause li{break-inside:avoid}}

/* ===== 나만의 약점 유형 (weak-type bookmarking) ===== */
.weakbtn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1.5px solid #fdba74;background:#fff;color:var(--orange-d);cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap}
.weakbtn.on{background:var(--orange-d);color:#fff;border-color:var(--orange-d)}
.weakbtn:active{transform:scale(.96)}
.cause li .weak-row{margin-top:8px}
td.weak-cell{white-space:nowrap}
.weak-empty{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:14px 16px;line-height:1.7}
.weak-toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#1e293b;color:#fdba74;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:90;max-width:86vw;text-align:center}
@media print{.weak-toast{display:none!important}}

/* ===== extensions: gate / start / timer / answer-entry / banners ===== */
.gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:20px}
.gate-card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:40px 28px;max-width:380px;width:100%;text-align:center;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.gate-card .brand{font-family:'Noto Sans KR';font-size:10.5px;letter-spacing:.3em;color:#ffd9b8;font-weight:700;margin-bottom:12px}
.gate-card h2{font-family:'Jua';font-size:27px;margin-bottom:7px;font-weight:400;letter-spacing:.01em}
.gate-card p{font-family:'Noto Sans KR';font-size:13px;font-weight:400;opacity:.78;margin-bottom:22px;line-height:1.6}
.gate-card input{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;text-align:center;margin-bottom:12px;outline:none;font-family:'Noto Sans KR'}
.gate-card button{width:100%;padding:14px;border:none;border-radius:10px;background:var(--orange-d);color:#fff;font-size:17px;cursor:pointer;font-family:'Jua';font-weight:400;letter-spacing:.02em}
.gate-card .err{font-family:'Noto Sans KR';color:#ffd9b8;font-size:12px;font-weight:700;min-height:16px;margin-top:8px}

.small-cover{padding:34px 30px 28px}
.small-cover h1{font-size:25px}
.examinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 22px}
.examinfo div{background:var(--soft);border:1px solid #fdba74;border-radius:12px;padding:15px 8px;text-align:center}
.examinfo b{display:block;font-family:'Jua';font-size:24px;color:var(--navy);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2}
.examinfo span{display:block;margin-top:2px;font-family:'Noto Sans KR';font-size:11.5px;font-weight:700;color:var(--ink2)}
.startbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.startbtns button{flex:1;min-width:150px;padding:17px 14px;border:none;border-radius:13px;font-size:16.5px;cursor:pointer;font-family:'Jua';font-weight:400;letter-spacing:.01em}
.btn-primary{background:linear-gradient(135deg,#fb923c,var(--orange-d));color:#fff}
.btn-secondary{background:#eef1f6;color:#334}
.notewrap{font-family:'Noto Sans KR';font-size:12.5px;font-weight:400;color:var(--dim);background:var(--bg);border-radius:10px;padding:12px 14px;line-height:1.6}

.agrid{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;margin:14px 0}
@media(max-width:560px){.agrid{grid-template-columns:repeat(6,1fr);gap:10px}}
.abtn{aspect-ratio:1;min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:'Jua';font-size:17px;font-weight:400;color:#334;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .1s,box-shadow .1s,background .1s}
.abtn:active{transform:scale(.92)}
.abtn.wrong{background:#fee2e2;border:2px solid #dc2626;color:#dc2626;box-shadow:0 2px 8px rgba(220,38,38,.22)}
.countbar{font-family:'Noto Sans KR';font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:14px}
.answerbtns{display:flex;gap:10px}
.answerbtns button{flex:1;padding:16px;border:none;border-radius:12px;font-size:16px;cursor:pointer;font-family:'Jua';font-weight:400;letter-spacing:.01em}
.hint2{font-family:'Noto Sans KR';font-size:13px;font-weight:400;color:var(--ink2);background:var(--soft);border:1px solid #fdba74;border-radius:10px;padding:10px 13px;margin-bottom:6px}

.banner{max-width:900px;margin:0 auto;padding:11px 20px;font-size:13px;font-weight:700;text-align:center}
.banner.preview{background:#1e293b;color:#fdba74}
.banner.practice{background:#fff3e0;color:#7c2d12;border-bottom:1px solid #fdba74}
.banner.saveerr{background:#fee2e2;color:#991b1b;font-weight:600;font-size:12.5px}
.repwk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 15px;margin-bottom:8px;font-size:13px;color:var(--ink2)}
.repwk b{color:var(--orange-d)}

/* ===== attempt-progress (per-round retake view; personal, not part of ranking) ===== */
.attempt-progress{margin-top:26px;padding-top:20px;border-top:1px dashed var(--line)}
.attempt-progress .ap-note{font-size:12px;color:var(--dim);margin:6px 0 14px;padding-left:14px}
.attempt-progress table{margin-bottom:16px}
.dlt-up{color:#16a34a;font-weight:700}
.dlt-down{color:#dc2626;font-weight:700}
.dlt-flat{color:var(--dim);font-weight:700}
.solved-box{background:#f6fbf6;border:1.5px solid #bfe3c4;border-radius:12px;padding:14px 18px;margin-bottom:14px}
.solved-box .sb-hd{font-family:'Jua';font-size:15px;color:#16a34a;font-weight:400;margin-bottom:8px}
.solved-item{font-size:12.5px;color:var(--ink2);padding:6px 0;border-bottom:1px dashed var(--line)}
.solved-item:last-child{border-bottom:none}
.solved-item b{color:var(--ink)}
@media print{.attempt-progress{break-inside:avoid}.attempt-progress .cause{break-inside:avoid}.solved-box{break-inside:avoid}}

.print-btn{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;border:none;border-radius:50px;padding:13px 20px;font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:50;font-family:inherit}
@media print{.no-print,.print-btn{display:none!important}}
@media(max-width:700px){.kpi{grid-template-columns:repeat(2,1fr)}section{padding:26px 18px}.cover{padding:32px 22px 26px}.cmp-band{padding:14px 18px 0}th.weak-cell,td.weak-cell{display:none}}

/* timer screen (ported from final_timer_demo.html; redesigned for hierarchy/decluttering) */
.timer-wrap{max-width:520px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:14px}
.timer-wrap .hd{text-align:center}
.timer-wrap .hd .brand{font-family:'Noto Sans KR';font-size:10px;letter-spacing:.32em;color:var(--orange-d);font-weight:700}
.timer-wrap .hd h1{font-family:'Jua';font-size:20px;color:var(--navy);font-weight:400;margin-top:6px;line-height:1.35}
.timer-wrap .hd p{font-family:'Noto Sans KR';font-size:12px;font-weight:400;color:var(--dim);margin-top:3px}

/* clock: the anchor. everything else on the screen is quieter than this. */
.clock{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:24px;padding:28px 22px 24px;color:#fff;text-align:center;position:relative;overflow:hidden;box-shadow:0 14px 36px rgba(31,56,100,.26)}
.clock::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(249,115,22,.16)}
.phase{display:inline-block;font-family:'Noto Sans KR';font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#ffd9b8;background:rgba(255,255,255,.13);padding:5px 15px;border-radius:20px;position:relative;z-index:1}
.time{font-family:'Jua';font-size:clamp(50px,16vw,70px);line-height:1.05;letter-spacing:.01em;margin-top:14px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.time.warn{color:#fdba74} .time.over{color:#fca5a5}
.tsub{font-family:'Noto Sans KR';font-size:12.5px;font-weight:400;color:#c7d6ef;margin-top:3px;position:relative;z-index:1}
.track{margin-top:22px;height:9px;background:rgba(255,255,255,.18);border-radius:6px;position:relative;overflow:hidden;z-index:1}
.track i{display:block;height:100%;background:linear-gradient(90deg,#fb923c,#ea580c);border-radius:6px;width:0;transition:width .4s}
.marks{position:relative;height:14px;margin-top:4px;z-index:1}
.marks span{position:absolute;transform:translateX(-50%);font-family:'Noto Sans KR';font-size:9px;font-weight:600;color:rgba(255,255,255,.4)}
.tbtns{display:flex;gap:8px;margin-top:20px;position:relative;z-index:1;flex-wrap:wrap}
.tbtns button{flex:1;min-width:90px;min-height:48px;border:none;border-radius:12px;padding:13px 10px;font-family:'Jua';font-size:15px;font-weight:400;cursor:pointer;transition:.15s;letter-spacing:.01em}
#go{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;box-shadow:0 6px 16px rgba(234,88,12,.32)}
#go:hover{filter:brightness(1.07)}
#rs{background:rgba(255,255,255,.14);color:#fff}
#btnToAnswer{background:rgba(255,255,255,.92);color:var(--navy)}

/* controls row: deliberately quiet -- sits apart from the clock card so it never
   competes with the primary start/reset/answer actions above it. */
.topt{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:'Noto Sans KR';font-size:11.5px;font-weight:500;color:var(--dim)}
.topt label{display:flex;align-items:center;gap:5px;cursor:pointer}
.topt select{background:#fff;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-family:'Noto Sans KR';font-size:11.5px;font-weight:500}
.topt option{color:#222}
.topt .topt-sep{width:1px;height:12px;background:var(--line)}
.topt .topt-speed{opacity:.7}

.now{background:#fff;border:1px solid #fdba74;border-left:5px solid var(--orange-d);border-radius:0 14px 14px 0;padding:15px 18px;box-shadow:0 4px 14px rgba(234,88,12,.08)}
.now .t{font-family:'Noto Sans KR';font-size:10.5px;font-weight:700;color:var(--orange-d);letter-spacing:.05em}
.now .m{font-family:'Noto Sans KR';font-size:15px;font-weight:400;color:var(--ink);margin-top:4px;line-height:1.58}

.plan{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan .h2b{font-family:'Noto Sans KR';font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--dim);padding:12px 18px 9px;display:block}
.plan ol{list-style:none}
.plan li{display:flex;gap:12px;padding:11px 18px;border-top:1px solid #f4efe8;font-family:'Noto Sans KR';font-size:13px;font-weight:400;color:var(--ink2)}
.plan li b{flex:none;width:50px;font-family:'Jua';font-size:13.5px;color:var(--navy);font-weight:400}
.plan li.on{background:var(--soft)} .plan li.on b{color:var(--orange-d)}
.plan li.done{opacity:.4}
.plan li i{font-style:normal;display:block;font-family:'Noto Sans KR';font-size:11px;font-weight:400;color:var(--dim);margin-top:1px}

/* history: a quiet log, not a content block */
.tlog{font-family:'Noto Sans KR';font-size:10.5px;font-weight:400;color:var(--dim);padding:0 4px}
.tlog div{padding:4px 0;border-bottom:1px dashed var(--line)}
.tlog div:last-child{border-bottom:none}
.tlog b{color:var(--ink2);font-weight:700}
@media(max-width:380px){.time{font-size:clamp(44px,17vw,60px)}.tbtns button{font-size:13.5px;padding:12px 8px}}

/* ===== cue popup (large announcement modal) ===== */
.cue-modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease}
.cue-modal.show{opacity:1;pointer-events:auto}
.cue-modal .cue-card{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:24px;padding:40px 34px;max-width:480px;width:100%;text-align:center;position:relative;box-shadow:0 26px 64px rgba(0,0,0,.4);transform:scale(.9);transition:transform .22s ease}
.cue-modal.show .cue-card{transform:scale(1)}
.cue-modal .cue-card::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(249,115,22,.18)}
.cue-close{position:absolute;top:12px;right:14px;width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:16px;line-height:1;cursor:pointer;z-index:2}
.cue-phase{font-family:'Jua';font-size:28px;font-weight:400;color:#ffd9b8;position:relative;z-index:1;margin-bottom:14px}
.cue-msg{font-family:'Noto Sans KR';font-size:19px;font-weight:700;line-height:1.65;position:relative;z-index:1}

    if(idx<0) idx=sorted.length-1;
    var dn=sorted[idx], up = idx>0? sorted[idx-1] : null;
    var nearUp = up ? (up[1]-score)<=3 : false;
    var nearDn = (score-dn[1])<=3;

  }
  /* 전체 평균·분포·문항 정답률은 출처가 명시된 실측 자료만 진단에 쓴다.
     단순 숫자 배열이나 다른 회차에서 비례 복제한 값은 개인 진단에 섞지 않는다. */
  function populationStatsVerified(S){
    var e=S&&(S.populationEvidence||S.evidence);
    if(!(e&&e.status==='verified'&&e.sourceId&&e.sourceRef&&e.observedAt&&e.verifiedBy&&e.verifiedAt)) return false;
    var cohort=e.cohort||{}, distribution=e.scoreDistribution||{}, itemRates=e.itemRates||{};
    var size=Number(cohort.size), values=distribution.values;
    if(!(size>0&&Number(cohort.validScoreCount)===size&&Array.isArray(values)&&values.length===size&&Number(S.n)===size)) return false;
    if(!(Array.isArray(S.dist)&&S.dist.length===size&&S.dist.every(function(v,i){return Number(v)===Number(values[i]);}))) return false;
    if(!distribution.hash||!e.itemRatesHash||!cohort.definition) return false;
    if(values.some(function(v){return !Number.isFinite(Number(v))||Number(v)<0||Number(v)>100;})) return false;
    var mean=values.reduce(function(sum,v){return sum+Number(v);},0)/size;
    if(Math.abs(mean-Number(S.mean))>0.05||Math.abs(mean-Number(distribution.mean))>0.05) return false;
    for(var no=1;no<=M.questions;no++){
      var row=itemRates[no]||itemRates[String(no)], rate=S.rate&&Number(S.rate[no]);
      if(!row||!(Number(row.denominator)>0)||Number(row.denominator)!==size) return false;
      if(Number(row.correctCount)<0||Number(row.correctCount)>size) return false;
      if(!Number.isFinite(rate)||rate<0||rate>1||Math.abs(rate-Number(row.correctCount)/size)>0.000001) return false;
    }
    return true;
  }
  function publicCutVerified(S){
    if(!(S&&S.cutOnly&&M&&M.cutBasis)) return false;
    var rows=M.cutBasis.rows||[], sources=M.cutBasis.sources||[];
    var cuts=S.cuts||[];
    return sources.length>=2&&sources.every(function(s){return s.year&&/^https:\/\//.test(s.url||'');})&&rows.length>0&&cuts.length===rows.length+1&&rows.every(function(r){
      return Number(r.average)===round1((Number(r.y2024)+Number(r.y2025))/2);
    })&&rows.every(function(r,i){return cuts[i]&&cuts[i][0]===r.grade&&Number(cuts[i][1])===Number(r.average);});
  }
  /* 누적 성적: 최초 응시 회차별 석차 백분율 평균 -> 등급(band).
     학생 화면에는 참여 인원과 절대 등수를 표시하지 않습니다. */
  function cumulativeGrade(avgPct, bands){
    var bb = (bands||[]).slice().sort(function(a,b){return a[1]-b[1];});
    if(!bb.length) return null;
    return bb.filter(function(b){return avgPct<=b[1];})[0] || bb[bb.length-1];
  }
  /* 비교 기준(코호트) 안내: 석차/등급을 보여줄 때마다 함께 붙는 보조 설명입니다.
     온라인 학생이면서 완료한 회차가 compare.onlineMinRounds 미만이면 강조(주황 박스)로,
     그 외에는 조용한 캡션(.lead)으로 보여줍니다. */
  function isOnlineStudent(name){

  function buildCompareNote(round, cmp, online, roundsCompleted){
    if(!cmp) return null;
    var week = (round && round.week) || '';
    var basisTxt = week ? String(cmp.basis||'').split('{week}').join(week) : '';
    var parts = [];

    if(online){
      if(cmp.onlineNote) parts.push(cmp.onlineNote);
      if(roundsCompleted!=null && roundsCompleted<(cmp.onlineMinRounds||0)){
        emphasize = true;
        parts.push('연습 회차를 '+(cmp.onlineMinRounds||0)+'회 이상 채운 뒤 석차를 참고해 주세요.');

  function areaAgg(items, oxArr, rate, populationVerified){
    var showPopulation=populationVerified!==false;
    return M.areas.map(function(k){
      var n=0,cor=0,tot=0,got=0,rsum=0;
      items.forEach(function(it){
        if(it.area!==k) return;
        var b=BP(it.no); n++; tot+=b.pts; rsum+=(rate[it.no]||0);
        if(oxArr[it.no-1]!=='X'){ cor++; got+=b.pts; }
      });
      return {k:k, n:n, cor:cor, tot:round1(tot), got:round1(got), perf: tot? round1(got/tot*100):0, crowd: showPopulation&&n?round1(rsum/n*100):null};
    });
  }
  function subareaAgg(items, oxArr, rNum){
    var map={};
    items.forEach(function(it){
      var tx=taxonomyOf(rNum,it);
      var key=tx.subareaId||tx.subarea||it.subarea||it.type||'기타';
      var b=BP(it.no);
      if(!map[key]) map[key]={id:key,k:tx.subarea||it.subarea||it.type||'기타',n:0,cor:0,tot:0,got:0,wrongNos:[],types:[],reviewRequired:false};
      var x=map[key]; x.n++; x.tot+=b.pts;
      x.reviewRequired=x.reviewRequired||!!tx.reviewRequired;
      if(x.types.indexOf(it.type)<0) x.types.push(it.type);
      if(oxArr[it.no-1]==='X') x.wrongNos.push(it.no);
      else { x.cor++; x.got+=b.pts; }
    });
    return Object.keys(map).map(function(key){
      var x=map[key];
      x.tot=round1(x.tot); x.got=round1(x.got);
      x.perf=x.tot?round1(x.got/x.tot*100):0;
      x.weakness=round1(100-x.perf);
      x.lost=round1(x.tot-x.got);
      return x;
    }).sort(function(a,b){ return b.weakness-a.weakness || b.lost-a.lost || a.k.localeCompare(b.k,'ko'); });
  }
  function ptsAgg(items, oxArr, rate, populationVerified){
    var showPopulation=populationVerified!==false;
    var tiers=[]; M.blueprint.forEach(function(b){ if(tiers.indexOf(b.pts)<0) tiers.push(b.pts); });
    tiers.sort(function(a,b){return a-b;});

      var n=0,cor=0,tot=0,got=0,rsum=0;
      M.blueprint.forEach(function(b){
        if(b.pts!==k) return;
        n++; tot+=b.pts; rsum+=(rate[b.no]||0);
        if(oxArr[b.no-1]!=='X'){ cor++; got+=b.pts; }
      });
      return {k:k, n:n, cor:cor, tot:round1(tot), got:round1(got), perf: tot? round1(got/tot*100):0, crowd: showPopulation&&n?round1(rsum/n*100):null};
    });

  function missItems(items, oxArr, rate, pct){

  function causeGroups(items, oxArr){
    var wrongList=[]; var g={"조건":[],"절차":[],"개념":[]};
    items.forEach(function(it){
      if(oxArr[it.no-1]==='X'){
        wrongList.push(it);

  function buildContext(name, rNum, oxArr){
    var R = M.rounds[String(rNum)];
    var items = R.items, S = R.stats;
    var cutOnly=!!S.cutOnly;
    var populationVerified=populationStatsVerified(S);
    var cutVerified=publicCutVerified(S)||populationVerified;
    var rate={}; if(populationVerified) Object.keys(S.rate||{}).forEach(function(k){ rate[+k]=S.rate[k]; });
    var sc = computeScore(oxArr);
    var pct = populationVerified ? percentileOf(sc.score, S.dist, S.n) : null;
    var ci = cutVerified ? cutInfo(sc.score, S.cuts) : {grade:'기준 검증 대기',up:null,dn:null,near:false};
    var A = areaAgg(items, oxArr, rate, populationVerified);
    var P = ptsAgg(items, oxArr, rate, populationVerified);
    var SA = subareaAgg(items, oxArr, rNum);
    var miss = populationVerified ? missItems(items, oxArr, rate, pct) : [];
    var gain = round1(miss.reduce(function(s,no){return s+BP(no).pts;},0));
    var newScore = round1(sc.score+gain);

      miss:miss, gain:gain, newScore:newScore, newPct:newPct,
      wrongList:cg.wrongList, g:cg.g};
  }

  function originalWeakStatus(x){
    if(x.n===1 && x.wrongNos.length) return '확인 필요';
    if(x.weakness>=50) return '집중 보완';
    if(x.weakness>=30) return '보완 필요';
    if(x.weakness>=10) return '주의';
    return '안정';
  }
  function originalFirstAttempts(rNum, priorRows, attemptNo, fk, curOxArr, includeCurrent){
    var out=[];
    for(var n=1;n<=M.roundCount;n++){
      var key=setPrefix()+n, oxa=null;
      if(n===rNum && attemptNo===1 && includeCurrent) oxa=curOxArr;
      else if(priorRows[key] && validOx(priorRows[key].ox)) oxa=priorRows[key].ox.split('');
      if(oxa&&validOx(oxa)) out.push({n:n,oxArr:oxa,score:computeScore(oxa).score});
    }
    return out.sort(function(a,b){return a.n-b.n;});
  }
  function repeatedOriginalSubareas(attempts){
    var map={};
    attempts.forEach(function(a){
      var seen={}; var R=M.rounds[String(a.n)];
      (R.items||[]).forEach(function(it){
        if(a.oxArr[it.no-1]!=='X') return;
        var k=it.subarea||it.type||'기타';
        if(seen[k]) return; seen[k]=true;
        if(!map[k]) map[k]=[];
        map[k].push(a.n);
      });
    });
    return Object.keys(map).map(function(k){return {k:k,rounds:map[k]};})
      .filter(function(x){return x.rounds.length>=2;})
      .sort(function(a,b){return a.k.localeCompare(b.k,'ko');});
  }

  /* ---- 응시 차수별 변화 (per-round retake view; personal, does not affect 누적 성적) ---- */
  function attemptTrendHTML(R, S, map, attemptNos){
    var LBL=['','1차','2차','3차'];
    var canCompare=populationStatsVerified(S);
    var rows = attemptNos.map(function(a,idx){
      var sc = computeScore(map[a]);
      var pct = canCompare?percentileOf(sc.score, S.dist, S.n):null;
      var deltaHTML = '<span class="dlt-flat">-</span>';
      if(idx>0){
        var prev = computeScore(map[attemptNos[idx-1]]);
        var diff = round1(sc.score-prev.score);
        var cls = diff>0?'dlt-up':(diff<0?'dlt-down':'dlt-flat');
        deltaHTML = '<span class="'+cls+'">'+(diff>0?'+':'')+diff+'점</span>';
      }
      return '<tr><td>'+(LBL[a]||(a+'차'))+'</td><td class="c">'+sc.score+'점</td><td class="c">'+sc.correct+'문항</td>'+(canCompare?'<td class="c">'+pct+'%</td>':'')+'<td class="c">'+deltaHTML+'</td></tr>';
    }).join('');
    return '<table><tr><th>응시</th><th>점수</th><th>맞은 개수</th>'+(canCompare?'<th>석차 백분율</th>':'')+'<th>직전 대비</th></tr>'+rows+'</table>';
  }
  function attemptClassify(R, map, attemptNos){
    var first=attemptNos[0], last=attemptNos[attemptNos.length-1];
    var resolved=[], unresolved=[];
    R.items.forEach(function(it){
      if(map[first][it.no-1]!=='X') return; // only care about items wrong on the 1st attempt
      var wrongCount = attemptNos.filter(function(a){ return map[a][it.no-1]==='X'; }).length;
      if(map[last][it.no-1]==='X'){ unresolved.push({item:it, wrongCount:wrongCount}); }
      else{ resolved.push({item:it}); }
    });
    return {resolved:resolved, unresolved:unresolved};
  }
  function attemptResolvedHTML(list){
    if(!list.length) return '';
    var li = list.map(function(o){
      return '<div class="solved-item"><b>'+o.item.no+'번 · '+esc(o.item.type)+'</b> — 1차에 틀렸던 유형인데 이제 풉니다.</div>';
    }).join('');
    return '<div class="solved-box"><div class="sb-hd">해결된 유형 <span style="font-size:12px;color:var(--ink2);font-weight:400">('+list.length+'개)</span></div>'+li+'</div>';
  }
  function attemptUnresolvedHTML(list, R, attemptCount){
    if(!list.length) return '';

        : (attemptCount+'번 응시 중 '+o.wrongCount+'번 틀렸습니다. 아직 해결되지 않았습니다.');
      return '<li><span class="no">'+it.no+'번</span><b>'+esc(it.type)+'</b><em>'+b.pts+'점</em>'+

  function attemptSectionHTML(roundNum, priorRows, attemptNo, fk, fk2, fk3, curOx, includeCurrent){
    var R = M.rounds[String(roundNum)]; if(!R) return '';
    var S = R.stats;
    var map={};
    if(priorRows[fk]&&validOx(priorRows[fk].ox)) map[1]=priorRows[fk].ox.split('');
    if(priorRows[fk2]&&validOx(priorRows[fk2].ox)) map[2]=priorRows[fk2].ox.split('');
    if(priorRows[fk3]&&validOx(priorRows[fk3].ox)) map[3]=priorRows[fk3].ox.split('');
    if(includeCurrent!==false&&validOx(curOx)) map[attemptNo]=curOx;
    var attemptNos = Object.keys(map).map(Number).sort(function(a,b){return a-b;});
    if(attemptNos.length<2) return '';
    var cls = attemptClassify(R, map, attemptNos);
    return '<div class="attempt-progress">'+
      '<h2 style="font-size:16px">응시 차수별 변화 <span style="font-size:11px;color:var(--dim);font-weight:400">(개인 연습 기록)</span></h2>'+
      '<div class="ap-note">이 회차를 '+attemptNos.length+'번 응시했습니다. 아래는 <b>연습 응시 기록</b>이며 <b>누적 성적에는 반영되지 않습니다.</b></div>'+
      attemptTrendHTML(R,S,map,attemptNos)+
      attemptResolvedHTML(cls.resolved)+
      attemptUnresolvedHTML(cls.unresolved, R, attemptNos.length)+
      '</div>';
  }

  /* attempt number = 1 + how many of the base-round save slots already exist.
     Derived purely from the Supabase row set (no localStorage), so it is
     correct across devices / private windows. Capped at 3 (final round key
     scheme only defines base/@2/@3). */
  function deriveAttemptNo(priorRows, fk, fk2){
    var attemptNo = 1;
    if(priorRows[fk]) attemptNo = 2;
    if(priorRows[fk] && priorRows[fk2]) attemptNo = 3;
    return attemptNo;
  }

  /* 누적 성적에 포함할 회차별 1차(기본) 응시 목록을 계산합니다.
     @2/@3(연습 재응시)는 절대 섞이지 않습니다 -- 현재 회차라도 attemptNo>1이면
     priorRows[fk](저장된 1차 응시)를 쓰고, curOxArr(이번 화면의 응시 데이터)는
     attemptNo===1일 때만 사용합니다. */
  function computeCumulativeConsidered(roundNum, priorRows, attemptNo, fk, curOxArr, includeCurrent){
    var considered = []; // {n, pct, oxArr}
    (M.cumulative.rounds||[]).forEach(function(rk){
      var mm = /^final(\d+)$/.exec(rk);
      if(!mm) return; // "last1-4" 등은 이 페이지의 데이터 범위 밖 (별도 데이터 파일 필요)
      var n = parseInt(mm[1],10);
      if(!M.rounds[String(n)]) return;
      var oxa;
      if(n===roundNum){
        if(attemptNo===1&&includeCurrent!==false) oxa = curOxArr;
        else if(priorRows[fk]&&validOx(priorRows[fk].ox)) oxa = priorRows[fk].ox.split('');
        else return;
      }
      else if(priorRows['final'+n]&&validOx(priorRows['final'+n].ox)) oxa = priorRows['final'+n].ox.split('');
      else return;
      var S2 = M.rounds[String(n)].stats;
      if(!populationStatsVerified(S2)) return;
      var sc2 = computeScore(oxa);
      var p2 = percentileOf(sc2.score, S2.dist, S2.n);
      considered.push({n:n, pct:p2, oxArr:oxa});
    });
    considered.sort(function(a,b){return a.n-b.n;});
    return considered;
  }
  function computePersonalAttempts(roundNum, priorRows, attemptNo, fk, curOxArr, includeCurrent){
    var out=[];
    for(var n=1;n<=roundNum;n++){
      if(!M.rounds[String(n)]) continue;
      var oxa=null;
      if(n===roundNum){
        if(attemptNo===1&&includeCurrent!==false) oxa=curOxArr;
        else if(priorRows[fk]&&validOx(priorRows[fk].ox)) oxa=priorRows[fk].ox.split('');
      }else if(priorRows['final'+n]&&validOx(priorRows['final'+n].ox)) oxa=priorRows['final'+n].ox.split('');
      if(oxa&&validOx(oxa)) out.push({n:n,oxArr:oxa,score:computeScore(oxa).score});
    }
    return out;
  }

  /* =====================================================
   * ===GF-WEAK-START=== 나만의 약점 유형 (pure state helpers)
   * weakMap is keyed by `type` string (never by qno) so that several
   * questions sharing the same type all reflect one shared mark.
   * ===================================================== */
  function markWeak(map, type, area, round, qno){
    var m={}; Object.keys(map||{}).forEach(function(k){ m[k]=map[k]; });
    m[type]={area:area||'', round:round||'', qno:qno==null?null:qno};
    return m;
  }
  function unmarkWeak(map, type){
    var m={}; Object.keys(map||{}).forEach(function(k){ m[k]=map[k]; });
    delete m[type];
    return m;
  }
  function isWeakMarked(map, type){ return !!(map && map[type]); }
  function weakListRows(map){
    return Object.keys(map||{}).sort().map(function(t){
      var v=map[t]||{}; return {type:t, area:v.area||'', round:v.round||'', qno:v.qno};
    });
  }

  /* ===================== Supabase ===================== */
  function scoreOfOx(oxArr){ return computeScore(oxArr); }
  /* 새 응시 슬롯은 insert-only로 저장해 동시에 제출되어도 먼저 도착한 기록을 보존한다.
     관리자가 명시적으로 RESET한 슬롯만 조건부 PATCH로 다시 열 수 있다. */
  async function supaUpsert(student, roundKey, oxArr, source){
    if(isLast) return {ok:false, conflict:false};
    var oxs = oxArr.join(''); var sc = scoreOfOx(oxArr);
    var payload={student:student, round:roundKey, ox:oxs, score:sc.score, wrong:sc.wrong, source:source||'parent', updated_at:new Date().toISOString()};
    try{
      var res = await fetch(SUPA_URL+"/rest/v1/mock_results", {
        method:"POST",
        headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json", Prefer:"return=minimal"},
        body:JSON.stringify(payload)
      });
      if(res.ok) return {ok:true, conflict:false};
      if(res.status!==409) return {ok:false, conflict:false};

      var resetUrl=SUPA_URL+"/rest/v1/mock_results?student=eq."+encodeURIComponent(student)
        +"&round=eq."+encodeURIComponent(roundKey)+"&source=eq.reset&ox=eq.RESET&select=round";
      var reopened=await fetch(resetUrl,{
        method:"PATCH",
        headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json", Prefer:"return=representation"},
        body:JSON.stringify(payload)
      });
      if(!reopened.ok) return {ok:false, conflict:false};
      var changed=await reopened.json();
      return {ok:Array.isArray(changed)&&changed.length===1, conflict:!Array.isArray(changed)||changed.length!==1};
    }catch(e){ return {ok:false, conflict:false}; }
  }
  async function supaLoadRows(student){
    var url = SUPA_URL+"/rest/v1/mock_results?select=student,round,ox,score,wrong,source,updated_at&student=eq."+encodeURIComponent(student);
    var res = await fetch(url, {headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}});
    if(!res.ok) throw new Error('성적 조회 HTTP '+res.status);
    var rows = await res.json();
    var map={},duplicates={};
    rows.forEach(function(r){
      if(r.source==='reset'||!validOx(r.ox)) return;
      var sc=computeScore(String(r.ox).split(''));
      if(Math.abs(Number(r.score)-sc.score)>0.0001||Number(r.wrong)!==sc.wrong) return;
      if(map[r.round]){duplicates[r.round]=true;return;}
      map[r.round]=r;
    });
    Object.keys(duplicates).forEach(function(k){delete map[k];});
    return map;
  }

  /* ---- weak_types (나만의 약점 유형): PK (student,type) ---- */
  async function supaWeakLoad(student){
    try{
      var url = SUPA_URL+"/rest/v1/weak_types?select=type,area,round,qno&student=eq."+encodeURIComponent(student);
      var res = await fetch(url, {headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}});
      if(!res.ok) return {};
      var rows = await res.json();
      var map={};
      rows.forEach(function(r){ map[r.type]={area:r.area, round:r.round, qno:r.qno}; });
      return map;
    }catch(e){ return {}; }
  }
  async function supaWeakUpsert(student, type, area, roundKey, qno){
    if(isLast) return false;
    try{
      var res = await fetch(SUPA_URL+"/rest/v1/weak_types", {
        method:"POST",
        headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates"},
        body: JSON.stringify({student:student, type:type, area:area, set_key:setPrefix(), round:roundKey, qno:qno})
      });
      return res.ok;
    }catch(e){ return false; }
  }
  async function supaWeakDelete(student, type){
    if(isLast) return false;
    try{

      var res = await fetch(url, {method:"DELETE", headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}});

    }catch(e){ return false; }
  }

  function wireWeakToggles(ctx){
    app.onclick = function(e){
      var btn = e.target && e.target.closest ? e.target.closest('.weakbtn') : null;
      if(!btn) return;
      var type = btn.getAttribute('data-type'); if(!type) return;
      var forceUnmark = btn.getAttribute('data-unmark')==='1';
      var wasMarked = isWeakMarked(state.weak, type);
      var turnOn = forceUnmark ? false : !wasMarked;
      var prevEntry = state.weak[type];
      var area = btn.getAttribute('data-area'); if(area==null || area==='') area = (prevEntry && prevEntry.area) || '';
      var qnoAttr = btn.getAttribute('data-qno');
      var qno = (qnoAttr!=null && qnoAttr!=='' && qnoAttr!=='null') ? parseInt(qnoAttr,10) : (prevEntry ? prevEntry.qno : null);
      var roundKey = finalKey();

      state.weak = turnOn ? markWeak(state.weak, type, area, roundKey, qno) : unmarkWeak(state.weak, type);
      refreshWeakUI(ctx);

      if(preview) return; // admin preview: never write to the DB

      var p = turnOn ? supaWeakUpsert(state.name, type, area, roundKey, qno) : supaWeakDelete(state.name, type);
      p.then(function(ok){
        if(ok) return;
        if(prevEntry) state.weak[type]=prevEntry; else delete state.weak[type];
        refreshWeakUI(ctx);
        showWeakToast('저장에 실패했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.');

  function renderTimer(){
    showPrint(false);
    var TOTAL = (M.exam.minutes||90)*60;
    var CUES = (CUES_DATA.length? CUES_DATA : [{at:0,ph:'시작',msg:'시작하자.'},{at:TOTAL,ph:'종료',msg:'수고했어.'}]).slice().sort(function(a,b){return a.at-b.at;});
    var examMinutes=Number(M.exam.minutes||90);
    var middleStart=examMinutes===80?32:35;
    var reviewStart=examMinutes===80?68:75;
    var fallbackPlan=[
      {from:0,t:"0~5분",  h:"시험지 훑어보기", d:"풀 수 있을 것 같은 문제 체크"},
      {from:5*60,t:"5~"+middleStart+"분", h:"1~12번 (2.7점)", d:"모르는 문제는 표시하고 넘어가기"},
      {from:middleStart*60,t:middleStart+"~"+reviewStart+"분",h:"13~30번 (3.4·4.2점)", d:"한 문제에 너무 오래 머물지 않기"},
      {from:reviewStart*60,t:reviewStart+"~"+examMinutes+"분",h:"마무리", d:"빈 답과 옮겨 적은 답 확인"}
    ];
    var PLAN=(Array.isArray(M.exam.plan)&&M.exam.plan.length?M.exam.plan.map(function(p){return {
      from:(Number(p.from)||0)*60,
      t:p.label||((p.from||0)+'~'+(p.to||M.exam.minutes)+'분'),
      h:p.title||'', d:p.detail||''
    };}):fallbackPlan);
    app.innerHTML =
      '<div class="timer-wrap">'+
      '<div class="hd"><div class="brand">G-FIELD GIFTED EDUCATION</div><h1>'+esc(M.title||'파이널 모의고사')+' · '+ (M.exam.minutes||90) +'분 실전 타이머</h1><p>시간 배분 훈련용입니다. 구간마다 음성으로 안내합니다.</p></div>'+
      '<div class="clock">'+
        '<div class="phase" id="ph">시작 대기</div>'+
        '<div class="time" id="tm">'+mmss(TOTAL)+'</div>'+
        '<div class="tsub" id="sb">시작을 누르면 안내가 시작됩니다</div>'+
        '<div class="track"><i id="bar"></i></div>'+
        '<div class="marks" id="mk"></div>'+
        '<div class="tbtns"><button id="go">시작</button><button id="rs">처음으로</button><button id="btnToAnswer">'+(M.mode==='paper-only'?'답안·해설 보기':'답안 입력하러 가기')+'</button></div>'+
      '</div>'+
      '<div class="topt">'+
        '<label><input type="checkbox" id="vc" checked> 음성 안내</label>'+
        '<label>목소리 <select id="vs"><option>불러오는 중…</option></select></label>'+
        '<span class="topt-sep" aria-hidden="true"></span>'+
        '<label class="topt-speed">속도 <select id="sp"><option value="1">실제 ('+(M.exam.minutes||90)+'분)</option><option value="30">30배</option><option value="90">90배</option><option value="300">300배</option></select></label>'+
      '</div>'+
      '<div class="now" id="now" style="display:none"><div class="t" id="nt"></div><div class="m" id="nm"></div></div>'+
      '<div class="plan"><span class="h2b">시간 배분</span><ol id="pl"></ol></div>'+
      '<div class="tlog" id="lg"></div>'+
      '</div>'+
      '<div class="cue-modal no-print" id="cueModal"><div class="cue-card">'+
        '<button type="button" class="cue-close" id="cueClose" aria-label="닫기">✕</button>'+
        '<div class="cue-phase" id="cuePhase"></div>'+
        '<div class="cue-msg" id="cueMsg"></div>'+
        '<div class="cue-tap">화면을 누르면 닫혀요</div>'+
      '</div></div>';

    var $=function(s){ return document.querySelector(s); };
    $('#pl').innerHTML = PLAN.map(function(p,i){ return '<li data-i="'+i+'"><b>'+p.t+'</b><span>'+p.h+'<i>'+p.d+'</i></span></li>'; }).join('');
    $('#mk').innerHTML = PLAN.slice(1).map(function(p){ var m=p.from/60; return '<span style="left:'+(m/(TOTAL/60)*100)+'%">'+m+'분</span>'; }).join('');

    var VOICES=[], PICK=null;
    var MALE_HINT=["injoon","인준","hyunsu","현수","male","남성","gyeong","minsu","jinho","kyuho","seoyeon-male"];
    function loadVoices(){
      VOICES = (window.speechSynthesis? speechSynthesis.getVoices():[]).filter(function(v){ return /ko/i.test(v.lang); });
      var sel=$('#vs');
      if(!VOICES.length){ sel.innerHTML='<option value="">한국어 음성 없음</option>'; return; }
      VOICES.sort(function(a,b){
        function m(v){ return MALE_HINT.some(function(h){ return v.name.toLowerCase().indexOf(h)>=0; })?0:1; }
        return m(a)-m(b);
      });
      sel.innerHTML = VOICES.map(function(v,i){ return '<option value="'+i+'">'+v.name.replace(/Microsoft |Google /,'')+'</option>'; }).join('');
      PICK=VOICES[0]; sel.value="0";
    }
    if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
    $('#vs').addEventListener('change', function(e){ PICK=VOICES[+e.target.value]||null; say('좋아, 이 목소리로 안내할게. 힘내자!'); });

    function say(txt,key){
      if(!$('#vc').checked) return;
      if(key!=null && M.exam.useRecordedCues!==false){
        var a=new Audio('voice/cue-'+key+'.mp3');
        a.onerror=function(){ tts(txt); };
        a.play().then(function(){}).catch(function(){ tts(txt); });
        return;
      }
      tts(txt);
    }
    function tts(txt){
      if(!window.speechSynthesis) return;
      try{
        speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(txt);
        u.lang='ko-KR'; u.rate=1.06; u.pitch=0.82; u.volume=1;
        if(PICK) u.voice=PICK;
        speechSynthesis.speak(u);
      }catch(e){}
    }
    function planIdx(sec){
      var idx=0;
      for(var i=1;i<PLAN.length;i++){ if(sec>=PLAN[i].from) idx=i; else break; }
      return idx;
    }

    /* ---- big cue popup: same trigger as the .now card / say(), just an additional
       full-screen alert. Newer cues replace the one on screen (no stacking); a
       single reusable timeout ref means bursts of cues (fast simulated speeds)
       never accumulate pending timers or DOM nodes. ---- */
    var cueTimeout=null;
    function showCueModal(c){
      var modal=$('#cueModal'); if(!modal) return;
      if(cueTimeout){ clearTimeout(cueTimeout); cueTimeout=null; }
      $('#cuePhase').textContent = c.ph || mmss(c.at);
      $('#cueMsg').textContent = c.msg;
      modal.classList.add('show');
      var len = (c.msg||'').length;
      var dur = Math.min(11000, Math.max(4500, 2600 + len*90));
      cueTimeout = setTimeout(function(){ modal.classList.remove('show'); cueTimeout=null; }, dur);
    }
    function hideCueModal(){
      var modal=$('#cueModal'); if(!modal) return;
      if(cueTimeout){ clearTimeout(cueTimeout); cueTimeout=null; }
      modal.classList.remove('show');
    }
    $('#cueModal').addEventListener('click', function(e){ if(e.target===this) hideCueModal(); });
    $('#cueClose').onclick = hideCueModal;

    var t=0, tid=null, fired={}, run=false;
    function paint(){
      var left=TOTAL-t;
      var el=$('#tm'); el.textContent=mmss(left);
      el.className='time'+(left<=5*60?' over':(left<=15*60?' warn':''));
      $('#bar').style.width=Math.min(100,t/TOTAL*100)+'%';
      var pi=planIdx(t);
      var lis=document.querySelectorAll('#pl li');
      lis.forEach(function(li,i){ li.className = i<pi?'done':(i===pi&&run?'on':''); });
      var p=PLAN[pi];
      $('#ph').textContent=p.h; $('#sb').textContent=p.d;
    }
    function cueCheck(){
      CUES.forEach(function(c,i){
        if(t>=c.at && !fired[i]){
          fired[i]=true;
          $('#now').style.display='block';
          $('#nt').textContent=mmss(c.at)+' 안내';
          $('#nm').textContent=c.msg;
          say(c.msg,i);
          showCueModal(c);
          var d=document.createElement('div');
          d.innerHTML='<b>'+mmss(c.at)+'</b> · '+esc(c.msg);
          $('#lg').prepend(d);
        }
      });
    }
    function tick(){
      var sp=+$('#sp').value;
      t+=sp; if(t>=TOTAL){ t=TOTAL; }
      cueCheck(); paint();
      if(t>=TOTAL){ clearInterval(tid); tid=null; run=false; $('#go').textContent='다시 시작'; }
    }
    $('#go').onclick=function(){
      if(tid){ clearInterval(tid); tid=null; run=false; $('#go').textContent='이어서'; paint(); return; }
      if(t>=TOTAL){ t=0; fired={}; $('#lg').innerHTML=''; $('#now').style.display='none'; }
      run=true; $('#go').textContent='일시정지';
      cueCheck(); paint();
      tid=setInterval(tick,1000);
    };
    $('#rs').onclick=function(){
      clearInterval(tid); tid=null; run=false; t=0; fired={};
      $('#lg').innerHTML=''; $('#now').style.display='none'; $('#go').textContent='시작';
      if(window.speechSynthesis) speechSynthesis.cancel();
      hideCueModal();
      paint();
    };
    $('#btnToAnswer').onclick=function(){
      if(tid) clearInterval(tid);
      if(window.speechSynthesis) speechSynthesis.cancel();
      hideCueModal();
      if(M.mode==='paper-only') openAnswerPage(); else renderAnswer();
    };
    paint();
  }

  function renderAnswer(){

    showPrint(false);
    var R = getRound();
    if(!state.oxArr) state.oxArr = Array(M.questions).fill('O');

      '<section>'+
      '<div class="hint2">✔️ <b>틀린 문제 번호만</b> 눌러 체크하세요. (누르면 ✕, 다시 누르면 해제) 이미 맞았다고 확신하는 문제는 누르지 마세요.</div>'+
      '<div class="agrid" id="agrid"></div>'+
      '<div class="countbar">선택된 오답: <b id="wcount">0</b>개</div>'+
      '<div class="answerbtns"><button class="btn-secondary" id="btnClear">모두 지우기</button><button class="btn-primary" id="btnGrade">채점하고 분석 보기</button></div>'+
      '<div class="no-print" style="text-align:center;margin-top:12px"><a href="#" id="toTimerLink" style="color:var(--dim);font-size:12px;text-decoration:underline">⏱ 시간 재고 풀어볼까요? 타이머로 이동</a></div>'+
      '</section></div>';
    paintGrid();
    document.getElementById('btnClear').onclick=function(){ state.oxArr=Array(M.questions).fill('O'); paintGrid(); };
    document.getElementById('btnGrade').onclick=function(){ gradeAndShowReport(); };
    document.getElementById('toTimerLink').onclick=function(e){ e.preventDefault(); renderTimer(); };
    function paintGrid(){
      var g=document.getElementById('agrid'); g.innerHTML='';
      for(var n=1;n<=M.questions;n++){
        (function(n){
          var w = state.oxArr[n-1]==='X';
          var b=document.createElement('div');
          b.className='abtn'+(w?' wrong':'');
          b.textContent=n;
          b.onclick=function(){ state.oxArr[n-1]= state.oxArr[n-1]==='X'?'O':'X'; paintGrid(); };
          g.appendChild(b);
        })(n);
      }
      document.getElementById('wcount').textContent = state.oxArr.filter(function(x){return x==='X';}).length;
    }
  }

  async function gradeAndShowReport(){
    app.innerHTML = '<div class="doc"><section><div class="lead">채점 중입니다…</div></section></div>';

    var priorRows = null;
    try{ priorRows = await supaLoadRows(state.name); }catch(e){}
    if(!priorRows && !preview){
      app.innerHTML='<div class="doc"><section><div class="banner saveerr no-print">기존 성적을 확인하지 못해 저장하지 않았습니다.</div><p class="lead">네트워크 상태를 확인한 뒤 다시 시도해 주세요. 최초 성적은 변경되지 않았습니다.</p><button class="btn-primary" id="retryGrade">다시 입력하기</button></section></div>';
      document.getElementById('retryGrade').onclick=renderAnswer;
      return;
    }
    if(!priorRows) priorRows={};
    try{ state.weak = await supaWeakLoad(state.name); }catch(e){ state.weak = {}; }

    var fk = finalKey();
    var fk2 = fk+'@2', fk3 = fk+'@3';
    var attemptNo = deriveAttemptNo(priorRows, fk, fk2);
    var saveKey = attemptNo===1 ? fk : (attemptNo===2 ? fk2 : fk3);
    var saveSource = attemptNo===1 ? firstAttemptSource(state.name) : (teacherEntry?'practice-admin':'practice');

    var saveErr = false, saveConflict = false, saved = false;
    if(!preview){
      var saveResult = await supaUpsert(state.name, saveKey, state.oxArr, saveSource);
      saved = !!saveResult.ok;
      saveConflict = !!saveResult.conflict;
      if(!saved) saveErr = true;
    }
    if(saveConflict){
      try{
        var refreshedRows=await supaLoadRows(state.name);
        var winningRow=refreshedRows&&refreshedRows[saveKey];
        if(!winningRow||typeof winningRow.ox!=='string'||winningRow.ox.length!==M.questions) throw new Error('최초 기록 재조회 실패');
        priorRows=refreshedRows;
        state.oxArr=winningRow.ox.split('');
      }catch(e){
        app.innerHTML='<div class="doc"><section><div class="banner saveerr no-print">다른 입력이 먼저 저장되어 현재 입력은 반영하지 않았습니다.</div><p class="lead">기존 최초 기록은 그대로 유지됩니다. 네트워크 상태를 확인한 뒤 다시 열어 주세요.</p></section></div>';
        return;
      }
    }
    var ctx = buildContext(state.name, roundNum, state.oxArr);

    if(ctx.cutOnly){
      renderOriginalReport(ctx, priorRows, attemptNo, fk, saveErr, saveConflict, saved);
      return;
    }

    /* 누적 성적 계산 (round>=2에서만 의미가 있음, final 라운드만 지원) */
    /* completed-rounds count는 '누적 성적' 계산과 같은 방식(1차 응시만, 회차별 1건)으로
       구해 비교-기준 안내(온라인 학생의 연습 회차 부족 강조)에도 그대로 재사용합니다. */
    var includeCurrent=preview||saved||saveConflict;
    var personalAttempts = computePersonalAttempts(roundNum, priorRows, attemptNo, fk, state.oxArr, includeCurrent);
    var considered = computeCumulativeConsidered(roundNum, priorRows, attemptNo, fk, state.oxArr, includeCurrent);
    var cmpOnline = isOnlineStudent(ctx.name);
    var cmpNoteHTML = ctx.populationVerified?compareNoteHTML(ctx.R, M.compare, cmpOnline, considered.length):'';

    var cumHTML;
    if(!ctx.populationVerified){
      var personalTrend=personalAttempts.length?'<table><tr><th>최초 응시</th><th>개인 점수</th></tr>'+personalAttempts.map(function(c){return '<tr><td>파이널 '+c.n+'회</td><td class="c"><b>'+c.score+'점</b></td></tr>';}).join('')+'</table>':'<div class="lead">아직 누적할 최초 응시 기록이 없습니다.</div>';
      var safeRepMap={};
      personalAttempts.forEach(function(c){
        var seen={},R2=M.rounds[String(c.n)];
        R2.items.forEach(function(it){
          if(c.oxArr[it.no-1]!=='X') return;
          var tx=taxonomyOf(c.n,it);
          var key=tx.reviewRequired?('raw|'+it.area+'|'+it.type):tx.canonicalTypeId;
          if(seen[key]) return; seen[key]=true;
          if(!safeRepMap[key]) safeRepMap[key]={label:tx.reviewRequired?it.type:(tx.typeFamilyLabel||it.type),subarea:tx.subarea,rounds:[],reviewRequired:!!tx.reviewRequired};
          safeRepMap[key].rounds.push(c.n);
        });
      });
      var safeRepeated=Object.keys(safeRepMap).map(function(k){return safeRepMap[k];}).filter(function(x){return x.rounds.length>=2;});
      var safeRepHTML=safeRepeated.length?safeRepeated.map(function(x){return '<div class="repwk"><b>'+esc(x.label)+'</b> — 파이널 '+x.rounds.join('·')+'회 반복 오답'+(x.reviewRequired?' <small>(소영역 분류 검토 중)</small>':'')+'</div>';}).join(''):'<div class="repwk">같은 세부유형이 두 회차 이상 반복된 오답은 아직 없습니다.</div>';
      cumHTML='<div class="able-box">전체 분포의 출처·표본·산출 방식 검증 전이므로 누적 석차와 반 배정 예측은 표시하지 않습니다. 아래에는 학생의 실제 최초 점수와 동일 세부유형 반복만 표시합니다.</div>'+personalTrend+
        '<h2 style="margin-top:22px;font-size:16px">회차를 건너 반복되는 세부유형</h2>'+safeRepHTML;
    } else if(roundNum<=1){
      cumHTML = '<p style="font-size:14px;color:var(--ink2)">이번이 첫 회차라 아직 누적 데이터가 없습니다. 지금은 무슨 반 가능 여부보다 <b>현재 위치를 파악하는 것</b>에 의미가 있습니다. 2회차부터 회차별 추이와 누적 석차, 그리고 <b>회차를 건너 반복해서 틀리는 유형</b>이 표시됩니다.</p>';
    } else {
      /* 누적 성적은 1차(기본) 응시만 사용합니다. 연습 재응시(@2/@3)는 절대 포함하지 않습니다. */
      if(!considered.length){
        cumHTML = '<p style="font-size:14px;color:var(--ink2)">아직 누적 계산에 쓸 이전 파이널 회차 기록이 없습니다.</p>';
      } else {
        var avgPct = round1(considered.reduce(function(s,c){return s+c.pct;},0)/considered.length);
        var band = cumulativeGrade(avgPct, M.cumulative.bands) || ['-', 0];
        var trend = considered.map(function(c){ return '<tr><td>파이널 '+c.n+'회</td><td class="c">'+c.pct+'%</td></tr>'; }).join('');
        var repMap = {};
        considered.forEach(function(c){
          var R2 = M.rounds[String(c.n)];
          R2.items.forEach(function(it){
            if(c.oxArr[it.no-1]==='X'){ (repMap[it.type]=repMap[it.type]||[]).push(c.n); }
          });
        });
        var repEntries = Object.keys(repMap).map(function(t){ return {type:t, rounds:repMap[t].slice().sort(function(a,b){return a-b;})}; }).filter(function(e){ return e.rounds.length>1; });
        var repHTML = repEntries.length
          ? repEntries.map(function(e){ return '<div class="repwk"><b>'+esc(e.type)+'</b> — '+repeatLabel(e.rounds)+'</div>'; }).join('')
          : '<div class="repwk">회차를 건너 반복해서 틀린 유형은 아직 없습니다.</div>';
        var cumLabel = esc(M.cumulative.label || M.cumulative.method || '석차 백분율 평균');
        cumHTML = '<table><tr><th>회차</th><th>석차 백분율</th></tr>'+trend+'</table>'+
          '<div class="cause-sum" style="margin-top:14px">'+cumLabel+' <b>'+avgPct+'%</b> → <b>'+esc(band[0])+'</b></div>'+
          cmpNoteHTML+
          '<h2 style="margin-top:22px;font-size:16px">회차를 건너 반복되는 약점 유형</h2>'+
          repHTML;
      }
    }

    var attemptHTML = attemptSectionHTML(roundNum, priorRows, attemptNo, fk, fk2, fk3, state.oxArr, includeCurrent);

    var previewBanner = preview ? '<div class="banner preview no-print">🔎 관리자 미리보기 — 저장되지 않습니다</div>' : '';
    var teacherBanner = (!preview && teacherEntry) ? '<div class="banner preview no-print">🧑‍🏫 선생님 대리 입력 — 재원생의 답안을 대신 기록합니다. 회차별 최초 성적만 누적에 반영됩니다.</div>' : '';
    var practiceBanner = (!preview && attemptNo>=2) ? '<div class="banner practice no-print">연습 응시 — 기록은 남지만 누적 성적에는 반영되지 않습니다 ('+attemptNo+'회차 시도)</div>' : '';
    var saveErrBanner = saveErr ? '<div class="banner saveerr no-print">'+(saveConflict?'다른 입력이 먼저 저장되어 기존 최초 기록을 유지했습니다.':'저장 실패, 네트워크 확인')+'</div>' : '';
    var kpiHTML=ctx.populationVerified
      ? '<div><i>점수 / 평균</i><b>'+ctx.score+'<small> / '+ctx.S.mean+'</small></b></div><div><i>맞은 개수</i><b>'+ctx.ncorr+'<small> / 30</small></b></div><div><i>석차</i><b>'+ctx.pct+'%</b></div><div><i>예상 결과</i><b style="font-size:15px">'+esc(ctx.grade)+'</b></div>'
      : '<div><i>개인 점수</i><b>'+ctx.score+'<small> / 100</small></b></div><div><i>맞은 개수</i><b>'+ctx.ncorr+'<small> / 30</small></b></div><div><i>오답</i><b>'+ctx.wrong+'<small>문항</small></b></div><div><i>진단 기준</i><b style="font-size:15px">개인 수행</b></div>';
    var areaLead=ctx.populationVerified?'주황색이 '+esc(ctx.name)+' 학생, 회색 점선이 검증된 비교집단입니다.':'학생이 맞힌 문항의 배점만으로 계산한 개인 수행률입니다.';
    var areaLegend='<div class="legend"><span><s style="background:rgba(249,115,22,.5);border:1px solid #ea580c"></s>'+esc(ctx.name)+'</span>'+(ctx.populationVerified?'<span><s style="background:rgba(148,163,184,.4);border:1px dashed #94a3b8"></s>검증된 비교집단</span>':'')+'</div>';
    var areaTable=ctx.populationVerified
      ? '<table><tr><th>영역</th><th>출제</th><th>정답</th><th>배점</th><th>득점</th><th>수행률</th><th>비교집단</th></tr>'+areaRowsHTML(ctx.A)+'</table>'
      : '<table><tr><th>영역</th><th>출제</th><th>정답</th><th>배점</th><th>득점</th><th>수행률</th></tr>'+areaRowsPersonalHTML(ctx.A)+'</table>';
    var ptsTable=ctx.populationVerified
      ? '<table><tr><th>구분</th><th>출제</th><th>정답</th><th>배점</th><th>득점</th><th>수행률</th><th>비교집단</th></tr>'+ptsRowsHTML(ctx.P)+'</table>'
      : '<table><tr><th>구분</th><th>출제</th><th>정답</th><th>배점</th><th>득점</th><th>수행률</th></tr>'+ptsRowsPersonalHTML(ctx.P)+'</table>';
    var detailLead=ctx.populationVerified?'검증된 문항 정답률과 함께 문항별 주의점을 표시합니다.':'학생의 정오와 문항별 복습 주의점만 표시합니다.';
    var cumulativeLead=ctx.populationVerified?'검증된 최초 응시 분포가 있는 회차만 누적 비교에 사용합니다.':'최초 응시의 개인 점수와 동일 세부유형 반복만 누적합니다.';

    app.innerHTML = previewBanner+teacherBanner+practiceBanner+saveErrBanner+
      '<div class="doc">'+
      '<div class="cover">'+
        '<div class="brand">G-FIELD GIFTED EDUCATION</div>'+
        '<h1>파이널 모의고사 진단분석지</h1>'+
        '<div class="sub">초등선발 대비 실전 파이널 모의고사 '+roundNum+'회 · 생각하는 황소 대비</div>'+
        '<div class="who"><b>'+esc(ctx.name)+'</b><span>학생</span></div>'+
        '<div class="kpi">'+kpiHTML+'</div>'+
      '</div>'+
      (cmpNoteHTML ? '<div class="cmp-band">'+cmpNoteHTML+'</div>' : '')+
      '<section>'+
        '<h2>영역별 수행률</h2>'+
        '<div class="lead">'+areaLead+'</div>'+
        '<div class="split"><div>'+radarSVG(ctx.A,!ctx.populationVerified)+areaLegend+'</div>'+areaTable+'</div>'+
        '<h2 style="margin-top:30px">배점대별 수행률</h2>'+
        '<div class="lead">어느 난이도 구간에서 무너지는지 봅니다.</div>'+
        ptsTable+
        canonicalSubareaHTML(ctx)+
        cutWarnHTML(ctx)+
      '</section>'+
      '<section>'+
        '<h2>오답 복습 점검</h2>'+
        '<div class="lead">문항에 등록된 주의점을 기준으로 묶었습니다. 실제 오답 원인은 풀이를 다시 보며 학생 또는 교사가 확인합니다. <span class="no-print">유형 옆의 <b>이 유형 어려워요</b>를 누르면 아래 목록에 저장됩니다.</span></div>'+
        '<div class="cause-sum">'+causeSumHTML(ctx)+'</div>'+
        '<div id="causeWrap">'+causeWrapHTML(ctx)+'</div>'+
      '</section>'+
      '<section>'+
        '<h2>문항별 상세</h2>'+
        '<div class="lead">'+detailLead+'</div>'+
        '<div id="detailWrap">'+detailTableHTML(ctx)+'</div>'+
      '</section>'+
      '<section>'+
        '<h2>누적 성적</h2>'+
        '<div class="lead">'+cumulativeLead+'</div>'+
        cumHTML+
        attemptHTML+
      '</section>'+
      weakSectionHTML(ctx)+
      '<section style="border-bottom:none">'+
        '<h2>원장 코멘트</h2>'+
        '<div class="cmt" id="cmtBody">'+buildComment(ctx, state.weak)+'</div>'+
        '<div class="sign">지필드 영재교육 원장 <b>DOCSSAM</b></div>'+
      '</section>'+
      '</div>';
    showPrint(true);
    printBtn.onclick = function(){ window.print(); };
    wireWeakToggles(ctx);
  }

  /* ===================== boot ===================== */
  function boot(){
    if(!roundNum){
      document.title='회차 확인 · 지필드 영재교육';
      app.innerHTML='<div class="doc"><section><h2>회차를 확인해 주세요</h2><div class="lead">'+esc(seriesLabel())+' 모의고사 1~'+maxRound+'회 중 올바른 회차를 선택해 주세요.</div></section></div>';
      return;
    }
    if(!M || !M.rounds){ app.innerHTML='<div class="doc"><section><h2>데이터를 불러오지 못했습니다</h2></section></div>'; return; }
    var contractErrors=validateExamContract();
    if(contractErrors.length){
      app.innerHTML='<div class="doc"><section><h2>시험 데이터 검증 대기</h2><div class="lead">'+esc(contractErrors.join(' · '))+'</div></section></div>';
      return;
    }
    document.title=roundLabel(roundNum)+' · 지필드 영재교육';
    var student = urlName;
    if(!student){ try{ student = localStorage.getItem('gfield_student')||''; }catch(e){ student=''; } }
    if(student){ state.name=student; enterFlow(); }
    else { renderGate(); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
